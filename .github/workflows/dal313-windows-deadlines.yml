name: DAL-313 Windows deadline diagnostic

on:
  push:
    branches:
      - diagnostic/DAL-313-windows-deadlines

permissions:
  contents: read

concurrency:
  group: dal313-deadlines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Observe original Windows Rust runner
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out fixed original code input
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: beb0bebccad4fc42cac39e6cb055d60018a55860
          fetch-depth: 0
      - name: Check out reviewed diagnostic control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: .dal313-control
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Guard original attempt, runner and source inputs
        run: >-
          python .dal313-control/scripts/dal313_deadlines.py preflight --surface rust
          --source . --output target/dal313-windows-deadlines/rust
      - name: Install original Python test dependencies
        run: python -m pip install "numpy>=2.0.0" "pyarrow==24.0.0"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Observe original Rust runner and default concurrency
        timeout-minutes: 50
        run: >-
          python .dal313-control/scripts/dal313_deadlines.py rust
          --source . --output target/dal313-windows-deadlines/rust
      - name: Upload evidence even after guard or test failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dal313-windows-rust-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/dal313-windows-deadlines/rust
          if-no-files-found: error
          retention-days: 14

  python:
    name: Observe original Windows Python xdist
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      JAX_PLATFORMS: cpu
      PYTEST_XDIST_AUTO_NUM_WORKERS: 2
    steps:
      - name: Check out fixed original code input
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: beb0bebccad4fc42cac39e6cb055d60018a55860
          fetch-depth: 0
      - name: Check out reviewed diagnostic control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: .dal313-control
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Guard original attempt, runner and source inputs
        run: >-
          python .dal313-control/scripts/dal313_deadlines.py preflight --surface python
          --source . --output target/dal313-windows-deadlines/python
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.21"
          enable-cache: true
      - name: Build native package with original CI mechanism
        run: uv sync --extra dev
      - name: Observe original Python suite with two xdist workers
        run: >-
          uv run python .dal313-control/scripts/dal313_deadlines.py python
          --source . --output target/dal313-windows-deadlines/python
      - name: Upload evidence even after guard or test failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dal313-windows-python-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: target/dal313-windows-deadlines/python
          if-no-files-found: error
          retention-days: 14
