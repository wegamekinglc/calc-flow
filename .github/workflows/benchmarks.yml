name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Candidate Linux CI head SHA
        required: true
        type: string
      candidate_wheel_artifact:
        description: Candidate python-distributions artifact ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  public-asof-projection:
    name: Public ASOF projection
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAYON_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Register clock and verify sealed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_wheel_artifact }}
        run: python -m scripts.hosted_asof_projection acquire
      - name: Install locked runtime dependencies
        run: |
          uv venv target/benchmark-venv
          uv pip sync --python target/benchmark-venv/bin/python --require-hashes benchmarks/requirements.lock
      - name: Measure the public single-run ASOF stream
        run: target/benchmark-venv/bin/python -m scripts.hosted_asof_projection measure
      - name: Preserve stopped or completed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-asof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/public-asof/*.json
            target/public-asof/*.jsonl
            target/public-asof/*/release.json
            target/public-asof/*/install.log
            target/public-asof/workers/
          if-no-files-found: error
          retention-days: 90
