name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  active-anti-watermark:
    name: Active anti join watermark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAYON_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Register clock and verify sealed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.hosted_anti_release
      - name: Install locked runtime dependencies
        run: |
          uv venv target/benchmark-venv
          uv pip sync --python target/benchmark-venv/bin/python --require-hashes benchmarks/requirements.lock
      - name: Measure one live public anti-join watermark release
        run: PYTHONPATH=. target/benchmark-venv/bin/python benchmarks/join-asof/20261123-anti-watermark/collect.py python target/anti-watermark
      - name: Preserve stopped or completed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: active-anti-watermark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/anti-watermark/*.json
            target/anti-watermark/*.jsonl
            target/anti-watermark/release/release.json
            target/anti-watermark/release/install.log
            target/anti-watermark/workers/
          if-no-files-found: error
          retention-days: 90
