name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Standard benchmarks, DAL-301 diagnostic, or sealed-wheel recovery
        type: choice
        options: [standard, dal301-groupby, suite-recovery]
        default: standard
      release_run_id:
        description: Original complete-suite run containing both sealed wheels
        type: string
        default: ""
      release_run_attempt:
        description: Original release artifact attempt
        type: number
        default: 1
      baseline_sha:
        description: Full baseline commit SHA for recovery
        type: string
        default: ""
      candidate_sha:
        description: Full candidate commit SHA for recovery
        type: string
        default: ""
      shard:
        description: Complete catalog shard to recover
        type: string
        default: engines-10000000
permissions:
  contents: read
  actions: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sql-datafusion-paired:
    name: SQL and raw DataFusion paired evidence
    if: inputs.mode == 'standard'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Build paired benchmark binary
        run: cargo bench --locked -p calc-flow --bench sql_datafusion_performance --no-run
      - name: Run two independent paired baselines
        run: |
          mkdir -p benchmark-results/sql-datafusion
          for repeat in first second; do
            for profile in serial-control matched-adaptive p32-saturation attribution; do
              cargo bench --locked -p calc-flow --bench sql_datafusion_performance -- \
                --profile "$profile" \
                --samples 20 \
                --warmups 2 \
                --output "${{ github.workspace }}/benchmark-results/sql-datafusion/${profile}-${repeat}.json"
            done
          done
      - name: Validate comparability, stability, and P1 targets
        run: |
          for profile in serial-control matched-adaptive p32-saturation attribution; do
            python scripts/verify_sql_datafusion_performance.py \
              "benchmark-results/sql-datafusion/${profile}-first.json" \
              --repeat "benchmark-results/sql-datafusion/${profile}-second.json" \
              --minimum-samples 20 \
              --require-stable
          done
          python scripts/verify_sql_datafusion_performance.py \
            benchmark-results/sql-datafusion/matched-adaptive-first.json \
            --repeat benchmark-results/sql-datafusion/matched-adaptive-second.json \
            --serial-control benchmark-results/sql-datafusion/serial-control-first.json \
            --minimum-samples 20 \
            --require-stable \
            --require-p1
          python scripts/analyze_sql_datafusion_attribution.py \
            benchmark-results/sql-datafusion/attribution-first.json \
            --output benchmark-results/sql-datafusion/attribution-analysis.json
      - name: Upload SQL/DataFusion reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-sql-datafusion-${{ github.run_id }}
          path: benchmark-results/sql-datafusion/*.json
          if-no-files-found: error
          retention-days: 90
  sql-datafusion-matrix:
    name: SQL/DataFusion adaptive tuning matrix
    if: inputs.mode == 'standard'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Build matrix benchmark binary
        run: cargo bench --locked -p calc-flow --bench sql_datafusion_performance --no-run
      - name: Run five-pair screening matrix
        run: |
          BENCH_BINARY="$(find target/release/deps -maxdepth 1 -type f \
            -name 'sql_datafusion_performance-*' -perm -111 | head -n 1)"
          test -n "$BENCH_BINARY"
          python scripts/run_sql_datafusion_matrix.py screen \
            --bench-binary "$BENCH_BINARY" \
            --output-dir benchmark-results/sql-datafusion/matrix/screening
      - name: Select the latency and RSS Pareto frontier
        run: |
          python scripts/run_sql_datafusion_matrix.py summarize \
            benchmark-results/sql-datafusion/matrix/screening/*.json \
            --output benchmark-results/sql-datafusion/matrix/pareto.json
      - name: Run two twenty-pair candidate baselines
        run: |
          BENCH_BINARY="$(find target/release/deps -maxdepth 1 -type f \
            -name 'sql_datafusion_performance-*' -perm -111 | head -n 1)"
          python scripts/run_sql_datafusion_matrix.py rerun \
            --bench-binary "$BENCH_BINARY" \
            --manifest benchmark-results/sql-datafusion/matrix/pareto.json \
            --output-dir benchmark-results/sql-datafusion/matrix/candidates
          for FIRST in benchmark-results/sql-datafusion/matrix/candidates/*-first.json; do
            SECOND="${FIRST%-first.json}-second.json"
            python scripts/verify_sql_datafusion_performance.py "$FIRST" \
              --repeat "$SECOND" --minimum-samples 20 --require-stable
          done
      - name: Upload SQL/DataFusion matrix reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-sql-datafusion-matrix-${{ github.run_id }}
          path: benchmark-results/sql-datafusion/matrix
          if-no-files-found: error
          retention-days: 90
  dal301-profile-build:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dal301-groupby'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [A, B]
    steps:
      - id: harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ matrix.side == 'A' && 'a594ad697a57947237dd289f3a1bc2272ef099e8' || 'b7e92cc58bc5000be0db5e6ec9a2decec052feb5' }}
          path: target/profile-source
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13.15
      - id: uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - id: rust
        uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Install locked build dependencies
        id: dependencies
        run: |
          uv venv target/diagnostic-venv
          uv pip sync --python target/diagnostic-venv/bin/python --require-hashes benchmarks/requirements.lock
      - name: Build separately identified profile wheel
        id: build
        env:
          PROFILE_SIDE: ${{ matrix.side }}
        run: |
          mkdir -p target/dal301-profile
          set +e
          target/diagnostic-venv/bin/python -m scripts.groupby_diagnostic build \
            --side "$PROFILE_SIDE" --source target/profile-source --output target/dal301-profile \
            >target/dal301-profile/stdout.log 2>target/dal301-profile/stderr.log
          result=$?
          set -e
          printf '%s\n' "$result" > target/dal301-profile/exit-code.txt
          cat target/dal301-profile/stdout.log
          cat target/dal301-profile/stderr.log >&2
          exit "$result"
      - name: Keep profile build step results
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          mkdir -p target/dal301-profile
          printf '%s\n' "$STEP_RESULTS" > target/dal301-profile/steps.json
          printf '%s\n' "$CHECKOUT_SHA" > target/dal301-profile/workflow-sha.log
      - name: Upload profile build and any failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dal301-profile-${{ matrix.side }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/dal301-profile/*.whl
            target/dal301-profile/*.json
            target/dal301-profile/*.log
            target/dal301-profile/*.txt
            target/dal301-profile/*.patch
          if-no-files-found: error
  dal301-groupby:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'dal301-groupby'
    needs: dal301-profile-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - id: harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13.15
      - id: uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Require completed profiling builds
        id: profile_builds
        env:
          BUILD_RESULT: ${{ needs.dal301-profile-build.result }}
        run: test "$BUILD_RESULT" = success
      - id: sealed_a
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10636839917
          run-id: 35596885420
          github-token: ${{ github.token }}
          path: target/sealed/A
          merge-multiple: true
      - id: sealed_b
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 10637665772
          run-id: 35596885420
          github-token: ${{ github.token }}
          path: target/sealed/B
          merge-multiple: true
      - id: profile_a
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dal301-profile-A-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/profiles/A
      - id: profile_b
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dal301-profile-B-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/profiles/B
      - name: Install identical locked benchmark dependencies
        id: dependencies
        run: |
          uv venv target/diagnostic-venv
          uv pip sync --python target/diagnostic-venv/bin/python --require-hashes benchmarks/requirements.lock
      - name: Run only fixed group_by controls, comparison and separate profiles
        id: diagnostic
        run: |
          mkdir -p target/dal301-evidence
          set +e
          target/diagnostic-venv/bin/python -m scripts.groupby_diagnostic run \
            --releases target/sealed --profiles target/profiles --output target/dal301-evidence \
            >target/dal301-evidence/stdout.log 2>target/dal301-evidence/stderr.log
          result=$?
          set -e
          printf '%s\n' "$result" > target/dal301-evidence/exit-code.txt
          cat target/dal301-evidence/stdout.log
          cat target/dal301-evidence/stderr.log >&2
          exit "$result"
      - name: Keep all preflight outcomes and missing artifact evidence
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          BUILD_RESULT: ${{ needs.dal301-profile-build.result }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          mkdir -p target/dal301-evidence
          printf '%s\n' "$STEP_RESULTS" > target/dal301-evidence/steps.json
          printf '%s\n' "$BUILD_RESULT" > target/dal301-evidence/profile-build-result.txt
          printf '%s\n' "$CHECKOUT_SHA" > target/dal301-evidence/workflow-sha.txt
      - name: Upload all two-case diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dal301-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/dal301-evidence/
          include-hidden-files: true
          if-no-files-found: error

  suite-recovery:
    name: Recover one complete benchmark shard
    if: inputs.mode == 'suite-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/target/uv-cache
      BENCHMARK_SHARD: ${{ inputs.shard }}
      EXPECTED_BASE: ${{ inputs.baseline_sha }}
      EXPECTED_HEAD: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.baseline_sha }}
          path: target/base
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install locked benchmark dependencies
        run: |
          uv venv target/benchmark-venv
          uv pip sync --python target/benchmark-venv/bin/python \
            --require-hashes benchmarks/requirements.lock
      - name: Install pinned Finance-Python for engine recovery
        if: startsWith(inputs.shard, 'engines-')
        run: |
          uv python install 3.9
          uv venv target/finance-python-venv --python 3.9
          uv pip sync --python target/finance-python-venv/bin/python \
            --require-hashes benchmarks/finance-python-requirements.lock
          git clone https://github.com/alpha-miner/Finance-Python.git \
            target/third-party/finance-python
          git -C target/third-party/finance-python checkout \
            3e33d3e70c3458b4c6dcf76b88df6148229b402c
          test "$(git -C target/third-party/finance-python rev-parse HEAD)" = \
            3e33d3e70c3458b4c6dcf76b88df6148229b402c
          uv pip install --python target/finance-python-venv/bin/python \
            --no-build-isolation --no-deps target/third-party/finance-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: benchmark-release-baseline-${{ inputs.release_run_id }}-${{ inputs.release_run_attempt }}
          path: target/releases/baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: benchmark-release-candidate-${{ inputs.release_run_id }}-${{ inputs.release_run_attempt }}
          path: target/releases/candidate
      - name: Validate recovery identities and catalog
        run: |
          target/benchmark-venv/bin/python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from scripts.benchmark_suite.catalog import get_shard
          from scripts.benchmark_suite.release import load_release
          for side, expected, source in (
              ("baseline", os.environ["EXPECTED_BASE"], "target/base"),
              ("candidate", os.environ["EXPECTED_HEAD"], "."),
          ):
              manifest = load_release(Path(f"target/releases/{side}/release.json"))
              actual = subprocess.check_output(
                  ["git", "-C", source, "rev-parse", "HEAD"], text=True
              ).strip()
              if manifest["git_sha"] != expected or actual != expected:
                  raise ValueError(f"{side}: release/source does not match expected SHA")
          shard = get_shard(os.environ["BENCHMARK_SHARD"])
          if shard["family"] not in ("engines", "warm", "python"):
              raise ValueError("recovery supports Python wheel shards")
          PY
      - name: Run complete recovery shard with resource diagnostics
        shell: bash
        env:
          FINANCE_PYTHON_PYTHON: target/finance-python-venv/bin/python
        run: |
          mkdir -p target/benchmark-results/resource-profile
          recovery_unit="calc-flow-benchmark-recovery-${{ github.run_id }}-${{ github.run_attempt }}"
          recovery_swap="$GITHUB_WORKSPACE/target/benchmark-recovery.swap"
          monitor_resources() {
            while true; do
              date -u
              free -m
              df -h .
              ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,12p'
              sleep 30
            done
          }
          monitor_resources &
          monitor_pid=$!
          stop_monitor() {
            sudo systemctl stop "$recovery_unit" 2>/dev/null || true
            sudo journalctl -u "$recovery_unit" --no-pager \
              > target/benchmark-results/resource-profile/unit.log || true
            pkill -P "$monitor_pid" 2>/dev/null || true
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            sudo swapoff "$recovery_swap" 2>/dev/null || true
            sudo rm -f -- "$recovery_swap"
          }
          trap stop_monitor EXIT
          sudo fallocate -l 8G "$recovery_swap"
          sudo chmod 600 "$recovery_swap"
          sudo mkswap "$recovery_swap"
          sudo swapon "$recovery_swap"
          printf '%s\n' MemoryHigh=10G MemoryMax=12G MemorySwapMax=8G \
            OOMPolicy=continue \
            > target/benchmark-results/resource-profile/properties.log
          sudo systemd-run --wait --pipe --collect \
            --unit="$recovery_unit" --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryHigh=10G --property=MemoryMax=12G \
            --property=MemorySwapMax=8G --property=OOMPolicy=continue \
            --setenv="PATH=$PATH" --setenv="UV_CACHE_DIR=$UV_CACHE_DIR" \
            --setenv="FINANCE_PYTHON_PYTHON=$FINANCE_PYTHON_PYTHON" \
            "$GITHUB_WORKSPACE/target/benchmark-venv/bin/python" \
            -m scripts.benchmark_suite run \
            --shard "$BENCHMARK_SHARD" \
            --baseline target/releases/baseline/release.json \
            --candidate target/releases/candidate/release.json \
            --baseline-source target/base --output target/benchmark-results \
            | tee target/benchmark-results/resource-profile/run.log
      - name: Retain recovered measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-suite-${{ inputs.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/benchmark-results/**/*.json
            target/benchmark-results/**/*.jsonl
            target/benchmark-results/**/*.log
            target/benchmark-results/**/*.md
            !target/benchmark-results/**/site/**
          if-no-files-found: error
          retention-days: 30
