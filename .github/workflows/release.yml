# One-off upload authorized by the user; do not merge this branch into main.
# Performance investigation deferred: https://github.com/wegamekinglc/calc-flow/actions/runs/34044587858
# Build the original v4.0.0 source; do not move the tag or upload Studio to PyPI.
name: Upload calc-flow-python 4.0.0
on:
  workflow_dispatch:
    inputs:
      confirm-publish:
        description: Publish calc-flow-python 4.0.0 from its existing tag
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare-python-release:
    name: Validate Python release source
    if: >-
      github.event_name == 'workflow_dispatch' && inputs['confirm-publish'] && github.ref == 'refs/heads/fix/pypi-core-upload-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 5c1cac1255e826ea4655244963c891681b14b97c
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate version, tag, and PyPI availability
        shell: bash
        run: |
          test "$(git cat-file -t refs/tags/v4.0.0)" = "tag"
          test "$(git rev-parse refs/tags/v4.0.0^{commit})" = "5c1cac1255e826ea4655244963c891681b14b97c"
          test "$(git rev-parse HEAD)" = "5c1cac1255e826ea4655244963c891681b14b97c"
          python scripts/verify_python_release.py --version-only --tag v4.0.0 --check-pypi
  crate:
    name: Verify crates.io package
    needs: prepare-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 5c1cac1255e826ea4655244963c891681b14b97c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Package and verify crate
        run: |
          cargo package -p calc-flow --locked
          python scripts/inspect_wheel.py crate target/package/calc-flow-*.crate
          cargo publish -p calc-flow --dry-run --locked
      - name: Upload crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-crate
          path: target/package/calc-flow-*.crate
          if-no-files-found: error
          retention-days: 30
  wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }}
    needs: prepare-python-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            smoke: true
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
            smoke: false
          - os: macos-15-intel
            target: x86_64
            manylinux: "off"
            smoke: true
          - os: macos-15
            target: aarch64
            manylinux: "off"
            smoke: true
          - os: windows-latest
            target: x64
            manylinux: "off"
            smoke: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 5c1cac1255e826ea4655244963c891681b14b97c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter
          manylinux: ${{ matrix.manylinux }}
      - name: Inspect wheel contents
        shell: bash
        run: |
          python -m unittest scripts.test_generate_rolling_kernel_manifest scripts.test_run_rust_tests scripts.test_run_rust_coverage scripts.test_classify_ci_changes scripts.test_build_python_release scripts.test_inspect_wheel scripts.test_release_config scripts.test_verify_python_release scripts.test_verify_perf_gates scripts.test_verify_stream_lifecycle_evidence scripts.test_verify_symbolic_milestone_perf scripts.test_write_criterion_provenance scripts.test_verify_complexity_gates scripts.test_verify_security_gates scripts.test_verify_sql_datafusion_performance scripts.test_analyze_sql_datafusion_attribution scripts.test_run_sql_datafusion_matrix
          python scripts/inspect_wheel.py core-wheel dist/*.whl
      - name: Smoke native wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m venv wheel-smoke
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            wheel_python="wheel-smoke/Scripts/python.exe"
          else
            wheel_python="wheel-smoke/bin/python"
          fi
          "${wheel_python}" -m pip install dist/*.whl
          "${wheel_python}" -m pip show calc-flow-python
          "${wheel_python}" scripts/smoke_wheel.py
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
  sdist:
    name: Python source distribution
    needs: prepare-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 5c1cac1255e826ea4655244963c891681b14b97c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          args: --out dist
      - name: Verify source distribution
        run: |
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          python scripts/inspect_wheel.py sdist "${archive}"
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
  studio-wheel:
    name: Studio wheel and static assets
    needs: prepare-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 5c1cac1255e826ea4655244963c891681b14b97c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Build core wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: x86_64
          args: --release --locked --out dist --find-interpreter
          manylinux: "2_28"
      - name: Build Studio static assets and wheel
        working-directory: web-ui
        run: |
          npm ci
          npm run build
          uv build --project backend --wheel --out-dir ../dist
      - name: Install and inspect local wheels
        run: |
          python scripts/inspect_wheel.py core-wheel dist/calc_flow_python-*.whl
          python scripts/inspect_wheel.py studio-wheel dist/calc_flow_studio-*.whl
          python -m venv studio-smoke
          python -m pip --python studio-smoke install dist/calc_flow_python-*.whl dist/calc_flow_studio-*.whl
          test -x studio-smoke/bin/calc-flow-web
          studio-smoke/bin/python - <<'PY'
          from importlib.metadata import requires
          from pathlib import Path

          import calc_flow_studio

          app = calc_flow_studio.create_app()
          paths = [route.path for route in app.routes]
          assert "/api/v3/catalog" in app.openapi()["paths"]
          assert "/" in paths
          assert "/assets" in paths
          requirements = requires("calc-flow-studio") or []
          assert any(
              requirement.lower().startswith("calc-flow-python")
              and ">=4.0.0" in requirement
              and "<5" in requirement
              for requirement in requirements
          )
          index = next(route for route in app.routes if route.path == "/").endpoint()
          assert Path(index.path).is_file()
          assert (Path(index.path).parent / "assets").is_dir()
          PY
      - name: Upload Studio wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-wheel
          path: dist/calc_flow_studio-*.whl
          if-no-files-found: error
          retention-days: 30
  audits:
    name: Dependency audits
    needs: prepare-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 5c1cac1255e826ea4655244963c891681b14b97c
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install locked Rust audit tools
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Run Rust audits
        run: |
          mkdir -p audit-reports
          cargo audit --ignore RUSTSEC-2026-0176 --ignore RUSTSEC-2026-0177 --ignore RUSTSEC-2026-0235
          cargo audit --ignore RUSTSEC-2026-0176 --ignore RUSTSEC-2026-0177 --ignore RUSTSEC-2026-0235 \
            --json > audit-reports/cargo-audit.json
          cargo deny --locked check
          cargo deny --locked --format json check 2> audit-reports/cargo-deny.json
          test -s audit-reports/cargo-audit.json
          test -s audit-reports/cargo-deny.json
      - name: Run production npm audit
        working-directory: web-ui
        run: |
          npm ci
          npm audit --omit=dev
          npm audit --omit=dev --json > ../audit-reports/npm-audit.json
          test -s ../audit-reports/npm-audit.json
      - name: Upload audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audits
          path: audit-reports/*.json
          if-no-files-found: error
          retention-days: 30
  verify-python-release:
    name: Verify Python release manifest
    needs:
      - crate
      - wheels
      - sdist
      - studio-wheel
      - audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 5c1cac1255e826ea4655244963c891681b14b97c
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Download core wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: release-dist/core
          merge-multiple: true
      - name: Download core source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: release-dist/core
      - name: Download Studio wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-wheel
          path: release-dist/studio
      - name: Validate Python artifact matrix and metadata
        shell: bash
        run: |
          python scripts/verify_python_release.py --dist-dir release-dist \
            --tag v4.0.0 --check-pypi \
            | tee release-dist/release-manifest.txt
      - name: Upload verified Python release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-python-release
          path: release-dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  publish-python-core:
    name: Publish calc-flow-python to PyPI
    if: >-
      github.event_name == 'workflow_dispatch' && inputs['confirm-publish'] && github.ref == 'refs/heads/fix/pypi-core-upload-v4'
    needs: verify-python-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/calc-flow-python/
    permissions:
      id-token: write
    steps:
      - name: Download verified Python release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-release
          path: release-dist
      - name: Verify exact release artifacts
        working-directory: release-dist
        shell: bash
        run: |
          sha256sum --check release-manifest.txt
          test "$(find core studio -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" \
            -eq "$(wc -l < release-manifest.txt)"
      - name: Publish exact core artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-dist/core
