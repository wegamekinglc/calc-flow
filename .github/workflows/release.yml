name: Publish verified calc-flow-python 2026.10.27
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-calc-flow-python-2026.10.27
  cancel-in-progress: false
jobs:
  publish-verified-release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/calc-flow-python/2026.10.27/
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: f40076cf4f3aa95b1682ae31a917829d2cda57c5
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify the exact successful rehearsal and installed-wheel gates
        run: |
          test "$(git rev-parse HEAD)" = f40076cf4f3aa95b1682ae31a917829d2cda57c5
          gh api repos/wegamekinglc/calc-flow/actions/runs/40532934622 > source-run.json
          gh api 'repos/wegamekinglc/calc-flow/actions/runs/40532934622/jobs?filter=latest&per_page=100' > source-jobs.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("source-run.json").read_text(encoding="utf-8"))
          assert run["repository"]["full_name"] == "wegamekinglc/calc-flow"
          assert run["path"] == ".github/workflows/release.yml"
          assert run["head_sha"] == "f40076cf4f3aa95b1682ae31a917829d2cda57c5"
          assert run["event"] == "workflow_dispatch"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["run_attempt"] == 1
          data = json.loads(Path("source-jobs.json").read_text(encoding="utf-8"))
          jobs = {job["name"]: job for job in data["jobs"]}
          required = {
              "Validate release version and tag",
              "Python source distribution",
              "Verify Python package artifacts",
              *(f"Installed wheel unit tests (Python {v})" for v in
                ("3.9", "3.10", "3.11", "3.12", "3.13", "3.14")),
              *(f"Wheel {os} {target} {tier}" for os, target in (
                  ("ubuntu-latest", "x86_64"), ("ubuntu-latest", "aarch64"),
                  ("macos-15-intel", "x86_64"), ("macos-15", "aarch64"),
                  ("windows-latest", "x64"),
              ) for tier in ("cp39", "cp313")),
          }
          assert data["total_count"] == len(data["jobs"]) == 20
          assert required <= jobs.keys()
          assert all(jobs[name]["status"] == "completed" and
                     jobs[name]["conclusion"] == "success" for name in required)
          PY
      - name: Download the original verified wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 40532934622
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download the original source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 40532934622
          name: python-sdist
          path: dist
      - name: Download the original artifact manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 40532934622
          name: python-release-manifest
          path: original-manifest
      - name: Verify all original bytes, package contents, and unused version
        run: |
          printf '%s  %s\n' 1247d8979b0c98bbf66df5cf8d16c75ab6d50b89345b8af41d52e6f192d6abbb original-manifest/release-manifest.txt | sha256sum --check
          (cd dist && sha256sum --check ../original-manifest/release-manifest.txt)
          python scripts/verify_python_release.py --version-only --tag calc-flow-python-v2026.10.27 --check-pypi
          python scripts/verify_python_release.py --dist-dir dist --core-only --tag calc-flow-python-v2026.10.27 > verified-manifest.txt
          cmp original-manifest/release-manifest.txt verified-manifest.txt
      - name: Create the new annotated tag at the user-selected release commit
        run: |
          git -c user.name='Cheng Li' -c user.email='scrappedprince.li@gmail.com' tag -a calc-flow-python-v2026.10.27 f40076cf4f3aa95b1682ae31a917829d2cda57c5 -m 'Release calc-flow-python 2026.10.27; verified artifacts from run 40532934622'
          git push origin refs/tags/calc-flow-python-v2026.10.27
      - name: Publish the original verified artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
