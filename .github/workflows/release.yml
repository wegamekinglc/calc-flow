name: Python package release
on:
  workflow_dispatch:
    inputs:
      initial-baseline:
        description: Full ancestor commit SHA for the first release rehearsal only
        type: string
        required: false
      allow-dependency-drift:
        description: >-
          Record an intended dependency change; incompatible benchmark
          evidence still blocks release acceptance
        type: boolean
        default: false
  push:
    tags:
      - "calc-flow-python-v*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  prepare-python-release:
    name: Validate release version and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate version, tag, and PyPI availability
        shell: bash
        run: |
          args=(--version-only)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
            test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
            args+=(--tag "${GITHUB_REF_NAME}" --check-pypi)
          fi
          python scripts/verify_python_release.py "${args[@]}"

  performance-collection:
    name: Paired release collection (${{ matrix.suite }})
    needs: prepare-python-release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        suite: [python, core, stream_join_perf]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Collect paired exact-ref ${{ matrix.suite }} evidence
        id: performance
        env:
          CALC_FLOW_BENCHMARK_SCALE: overhead
          JAX_PLATFORMS: cpu
          INITIAL_RELEASE_BASELINE: ${{ inputs['initial-baseline'] }}
        run: |
          mkdir -p target/release-evidence
          exec > >(tee target/release-evidence/performance.log) 2>&1
          baseline_args=()
          if [[ -n "${INITIAL_RELEASE_BASELINE}" ]]; then
            baseline_args+=(--initial-baseline "${INITIAL_RELEASE_BASELINE}")
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            baseline_args+=(--tag "${GITHUB_REF_NAME}")
          fi
          baseline_ref="$(python scripts/release_baseline.py "${baseline_args[@]}")"
          test -n "${baseline_ref}"
          baseline_sha="$(git rev-parse "${baseline_ref}^{commit}")"
          candidate_sha="$(git rev-parse "HEAD^{commit}")"
          test "${baseline_sha}" != "${candidate_sha}"
          git worktree add --detach target/release-baseline "${baseline_ref}"
          uv venv target/release-benchmark-env
          source target/release-benchmark-env/bin/activate
          uv pip install --require-hashes -r benchmarks/requirements.lock
          uv pip freeze > target/release-evidence/dependencies.txt
          perf_gate_extra_args=()
          if [[ "${{ inputs['allow-dependency-drift'] }}" == "true" ]]; then
            perf_gate_extra_args+=(--allow-dependency-drift)
          fi
          python -m scripts.release_performance \
            --baseline-source target/release-baseline \
            --output target/release-evidence \
            --suite "${{ matrix.suite }}" \
            "${perf_gate_extra_args[@]}"
      - name: Upload suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-performance-${{ matrix.suite }}
          path: |
            target/release-evidence
            !target/release-evidence/builds/*/cargo/**
            !target/release-evidence/install/**
            !target/release-evidence/rust-builds/*/core
            !target/release-evidence/rust-builds/*/stream_join_perf
            !target/release-evidence/rust-builds/*/allocation_regression
          if-no-files-found: error
          retention-days: 30
  acceptance-gates:
    name: Exact-head performance and security gates
    needs: [prepare-python-release, performance-collection]
    if: ${{ always() && needs.prepare-python-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Install locked Rust audit tools
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Download paired suite evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-performance-*
          path: target/release-evidence/suites
          merge-multiple: false
      - name: Merge paired exact-ref performance verdict
        id: performance
        env:
          COLLECTION_RESULT: ${{ needs.performance-collection.result }}
        run: |
          python -m scripts.release_performance \
            --merge-suites target/release-evidence/suites \
            --output target/release-evidence
          test "${COLLECTION_RESULT}" = success
      - name: Run security and supply-chain gate
        id: security
        run: |
          npm ci --prefix web-ui
          python scripts/verify_security_gates.py
      - name: Summarize acceptance outcomes
        if: always()
        env:
          ACCEPTANCE_STEPS: ${{ toJSON(steps) }}
        run: |
          python -m scripts.release_performance \
            --output target/release-evidence --acceptance-summary \
            --steps performance,security
      - name: Upload release performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-performance-evidence
          path: |
            target/release-evidence
            !target/release-evidence/suites/*/builds/*/cargo/**
            !target/release-evidence/suites/*/install/**
            !target/release-evidence/suites/*/rust-builds/*/core
            !target/release-evidence/suites/*/rust-builds/*/stream_join_perf
            !target/release-evidence/suites/*/rust-builds/*/allocation_regression
          if-no-files-found: error
          retention-days: 30
  soak-gates:
    name: Exact-head continuous-runtime soaks
    needs: prepare-python-release
    runs-on: ubuntu-latest
    # Runs alongside all three paired collection jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Run exact-head continuous-runtime soaks
        id: soak
        env:
          CALC_FLOW_STREAM_SOAK: "1"
          CALC_FLOW_M5_CHECKPOINT_SOAK: "1"
          CALC_FLOW_M7_WINDOW_STATE_SOAK: "1"
        run: |
          cargo test -p calc-flow --lib \
            operator::window::tests::high_cardinality_window_state_exceeds_legacy_json_limit_and_restores \
            -- --ignored --exact --nocapture
          cargo test -p calc-flow --lib \
            runtime::streaming::soak::twenty_minute_two_source_slow_sink \
            -- --ignored --exact --nocapture
          cargo test -p calc-flow --lib \
            runtime::streaming::soak::twenty_minute_epoch_checkpoint_restart \
            -- --ignored --exact --nocapture
  wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }} ${{ matrix.python_tag }}
    needs: prepare-python-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            python_tag: cp313
            manylinux: "2_28"
            smoke: true
          - os: ubuntu-latest
            target: x86_64
            python_tag: cp39
            manylinux: "2_28"
            smoke: true
          - os: ubuntu-latest
            target: aarch64
            python_tag: cp313
            manylinux: "2_28"
            smoke: false
          - os: ubuntu-latest
            target: aarch64
            python_tag: cp39
            manylinux: "2_28"
            smoke: false
          - os: macos-15-intel
            target: x86_64
            python_tag: cp313
            manylinux: "off"
            smoke: true
          - os: macos-15-intel
            target: x86_64
            python_tag: cp39
            manylinux: "off"
            smoke: true
          - os: macos-15
            target: aarch64
            python_tag: cp313
            manylinux: "off"
            smoke: true
          - os: macos-15
            target: aarch64
            python_tag: cp39
            manylinux: "off"
            smoke: true
          - os: windows-latest
            target: x64
            python_tag: cp313
            manylinux: "off"
            smoke: true
          - os: windows-latest
            target: x64
            python_tag: cp39
            manylinux: "off"
            smoke: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build modern abi3 wheel
        if: matrix.python_tag == 'cp313'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter --features pyo3/abi3-py313
          manylinux: ${{ matrix.manylinux }}
      - name: Build legacy abi3 wheel
        if: matrix.python_tag == 'cp39'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter --features legacy-python
          manylinux: ${{ matrix.manylinux }}
      - name: Inspect wheel contents
        shell: bash
        run: python scripts/inspect_wheel.py core-wheel dist/*.whl
      - name: Select wheel smoke interpreter
        if: matrix.smoke
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python_tag == 'cp39' && '3.9' || '3.13' }}
      - name: Run native wheel smoke
        if: matrix.smoke
        shell: bash
        run: |
          python -m venv wheel-smoke
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            wheel_python="wheel-smoke/Scripts/python.exe"
          else
            wheel_python="wheel-smoke/bin/python"
          fi
          "${wheel_python}" -m pip install dist/*.whl
          "${wheel_python}" -m pip show calc-flow-python
          "${wheel_python}" scripts/smoke_wheel.py
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.python_tag }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    name: Python source distribution
    needs: prepare-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          args: --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheel-python-versions:
    name: Installed wheel unit tests (Python ${{ matrix.python_version }})
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.9"
            python_tag: cp39
          - python_version: "3.10"
            python_tag: cp39
          - python_version: "3.11"
            python_tag: cp39
          - python_version: "3.12"
            python_tag: cp39
          - python_version: "3.13"
            python_tag: cp313
          - python_version: "3.14"
            python_tag: cp313
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Download matching Linux wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-ubuntu-latest-x86_64-${{ matrix.python_tag }}
          path: dist
      - name: Run installed wheel unit tests
        run: |
          python -m pip install dist/*.whl pytest numpy
          python -m pytest -q \
            python/tests/test_import.py \
            python/tests/test_python_version_contract.py \
            python/tests/test_compute.py \
            python/tests/test_symbolic_expr.py \
            python/tests/test_stream_entrypoints.py \
            python/tests/test_execution_options.py \
            python/tests/test_batch.py \
            python/tests/test_config.py \
            python/tests/test_udf.py
      - name: Test Python 3.9 JAX array extra
        if: matrix.python_version == '3.9'
        run: |
          python -m pip install 'jax==0.4.30'
          JAX_PLATFORMS=cpu python -m pytest -q python/tests/test_array.py

  verify-core-artifacts:
    name: Verify Python package artifacts
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Download Linux, Windows, and macOS wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download core source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist
      - name: Verify wheel matrix, metadata, and source distribution
        shell: bash
        run: |
          args=(--dist-dir dist --core-only)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python scripts/verify_python_release.py "${args[@]}" > release-manifest.txt
      - name: Upload verified artifact manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-release-manifest
          path: release-manifest.txt
          if-no-files-found: error
          retention-days: 30

  publish-python-core:
    name: Publish calc-flow-python to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify-core-artifacts, wheel-python-versions, acceptance-gates, soak-gates]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/calc-flow-python/
    permissions:
      id-token: write
    steps:
      - name: Download Linux, Windows, and macOS wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download core source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist
      - name: Download verified artifact manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-manifest
      - name: Confirm artifact integrity
        run: sha256sum --check ../release-manifest.txt
        working-directory: dist
      - name: Publish core artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
