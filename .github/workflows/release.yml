name: Release artifacts
on:
  workflow_dispatch:
    inputs:
      initial-baseline:
        description: Full ancestor commit SHA for the first release rehearsal only
        type: string
        required: false
      allow-dependency-drift:
        description: >-
          Acknowledge an intended benchmark dependency change so the
          exact-ref stream lifecycle gate records the drift instead of
          failing on the dependency fingerprint mismatch
        type: boolean
        default: false
  push:
    tags:
      - "v4.*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  prepare-python-release:
    name: Validate Python release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate version, tag, and PyPI availability
        shell: bash
        run: |
          args=(--version-only)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
            test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
            args+=(--tag "${GITHUB_REF_NAME}" --check-pypi)
          fi
          python scripts/verify_python_release.py "${args[@]}"
  acceptance-gates:
    name: Exact-head performance, security, and soak gates
    needs: prepare-python-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Install locked Rust audit tools
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Run paired exact-ref Rust and Python performance gate
        env:
          CALC_FLOW_BENCHMARK_SCALE: overhead
          JAX_PLATFORMS: cpu
          INITIAL_RELEASE_BASELINE: ${{ inputs['initial-baseline'] }}
        run: |
          baseline_args=()
          if [[ -n "${INITIAL_RELEASE_BASELINE}" ]]; then
            baseline_args+=(--initial-baseline "${INITIAL_RELEASE_BASELINE}")
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            baseline_args+=(--tag "${GITHUB_REF_NAME}")
          fi
          baseline_ref="$(python scripts/release_baseline.py "${baseline_args[@]}")"
          test -n "${baseline_ref}"
          baseline_sha="$(git rev-parse "${baseline_ref}^{commit}")"
          candidate_sha="$(git rev-parse "HEAD^{commit}")"
          test "${baseline_sha}" != "${candidate_sha}"
          git worktree add --detach "${RUNNER_TEMP}/calc-flow-baseline" "${baseline_ref}"
          mkdir -p "${RUNNER_TEMP}/benchmark-baseline" "${RUNNER_TEMP}/benchmark-candidate"
          python -c 'import json,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"role":sys.argv[2],"git_sha":sys.argv[3]},sort_keys=True)+"\n",encoding="utf-8")' \
            "${RUNNER_TEMP}/benchmark-baseline/provenance.json" baseline "${baseline_sha}"
          python -c 'import json,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"role":sys.argv[2],"git_sha":sys.argv[3]},sort_keys=True)+"\n",encoding="utf-8")' \
            "${RUNNER_TEMP}/benchmark-candidate/provenance.json" candidate "${candidate_sha}"
          CARGO_TARGET_DIR="${RUNNER_TEMP}/criterion-target" \
            cargo bench --manifest-path "${RUNNER_TEMP}/calc-flow-baseline/Cargo.toml" \
            --locked -p calc-flow --bench core -- --save-baseline exact-baseline
          CARGO_TARGET_DIR="${RUNNER_TEMP}/criterion-target" \
            cargo bench --manifest-path "${RUNNER_TEMP}/calc-flow-baseline/Cargo.toml" \
            --locked -p calc-flow --bench stream_join_perf -- \
            --save-baseline exact-baseline
          CARGO_TARGET_DIR="${RUNNER_TEMP}/criterion-target" \
            cargo bench --locked -p calc-flow --bench core -- \
            --save-baseline exact-candidate
          CARGO_TARGET_DIR="${RUNNER_TEMP}/criterion-target" \
            cargo bench --locked -p calc-flow --bench stream_join_perf -- \
            --save-baseline exact-candidate
          python -c 'import json,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({sys.argv[2]:sys.argv[3],sys.argv[4]:sys.argv[5]},sort_keys=True)+"\n",encoding="utf-8")' \
            "${RUNNER_TEMP}/criterion-target/criterion/criterion-provenance.json" \
            exact-baseline "${baseline_sha}" exact-candidate "${candidate_sha}"
          cd "${RUNNER_TEMP}/calc-flow-baseline"
          uv sync --extra benchmark
          uv run pytest benchmarks -q --benchmark-only \
            -k "not test_stream_window_checkpoint_and_recovery" \
            --benchmark-json="${RUNNER_TEMP}/benchmark-baseline/results.json"
          PYTHONPATH="${GITHUB_WORKSPACE}" uv run pytest \
            "${GITHUB_WORKSPACE}/benchmarks/test_symbolic_baseline.py::test_stream_window_checkpoint_and_recovery" \
            -q --benchmark-only \
            --benchmark-json="${RUNNER_TEMP}/benchmark-baseline/stream-lifecycle.json"
          uv run python "${GITHUB_WORKSPACE}/scripts/verify_stream_lifecycle_evidence.py" \
            "${RUNNER_TEMP}/benchmark-baseline/stream-lifecycle.json" \
            --minimum-rounds 20
          cd "${GITHUB_WORKSPACE}"
          uv sync --extra benchmark
          uv run pytest benchmarks -q --benchmark-only \
            -k "not test_stream_window_checkpoint_and_recovery" \
            --benchmark-json="${RUNNER_TEMP}/benchmark-candidate/results.json"
          uv run pytest \
            benchmarks/test_symbolic_baseline.py::test_stream_window_checkpoint_and_recovery \
            -q --benchmark-only \
            --benchmark-json="${RUNNER_TEMP}/benchmark-candidate/stream-lifecycle.json"
          uv run python scripts/verify_stream_lifecycle_evidence.py \
            "${RUNNER_TEMP}/benchmark-candidate/stream-lifecycle.json" \
            --minimum-rounds 20
          uv run python scripts/verify_symbolic_milestone_perf.py \
            --report "${RUNNER_TEMP}/benchmark-candidate/results.json" \
            --scenario rolling_kernel_sma20 \
            --scenario rolling_kernel_dual_sma_5_20 \
            --expected-commit "${candidate_sha}" \
            --output "${RUNNER_TEMP}/rolling-kernel-evidence.json"
          perf_gate_extra_args=()
          if [[ "${{ inputs['allow-dependency-drift'] }}" == "true" ]]; then
            perf_gate_extra_args+=(--allow-dependency-drift)
          fi
          uv run python scripts/verify_perf_gates.py \
            --baseline-dir "${RUNNER_TEMP}/benchmark-baseline" \
            --candidate-dir "${RUNNER_TEMP}/benchmark-candidate" \
            --criterion-dir "${RUNNER_TEMP}/criterion-target/criterion" \
            --criterion-baseline exact-baseline \
            --criterion-candidate exact-candidate \
            --require-stream-lifecycle \
            "${perf_gate_extra_args[@]}"
      - name: Run security and supply-chain gate
        run: |
          npm ci --prefix web-ui
          uv run python scripts/verify_security_gates.py
      - name: Run exact-head continuous-runtime soaks
        env:
          CALC_FLOW_STREAM_SOAK: "1"
          CALC_FLOW_M5_CHECKPOINT_SOAK: "1"
          CALC_FLOW_M7_WINDOW_STATE_SOAK: "1"
        run: |
          cargo test -p calc-flow --lib \
            operator::window::tests::high_cardinality_window_state_exceeds_legacy_json_limit_and_restores \
            -- --ignored --exact --nocapture
          cargo test -p calc-flow --lib \
            runtime::streaming::soak::twenty_minute_two_source_slow_sink \
            -- --ignored --exact --nocapture
          cargo test -p calc-flow --lib \
            runtime::streaming::soak::twenty_minute_epoch_checkpoint_restart \
            -- --ignored --exact --nocapture
  crate:
    name: Verify crates.io package
    needs: acceptance-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Package and verify crate
        run: |
          cargo package -p calc-flow --locked
          python scripts/inspect_wheel.py crate target/package/calc-flow-*.crate
          cargo publish -p calc-flow --dry-run --locked
      - name: Upload crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-crate
          path: target/package/calc-flow-*.crate
          if-no-files-found: error
          retention-days: 30
  wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }}
    needs: acceptance-gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            smoke: true
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
            smoke: false
          - os: macos-15-intel
            target: x86_64
            manylinux: "off"
            smoke: true
          - os: macos-15
            target: aarch64
            manylinux: "off"
            smoke: true
          - os: windows-latest
            target: x64
            manylinux: "off"
            smoke: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter
          manylinux: ${{ matrix.manylinux }}
      - name: Inspect wheel contents
        shell: bash
        run: |
          python -m unittest scripts.test_generate_rolling_kernel_manifest scripts.test_run_rust_tests scripts.test_run_rust_coverage scripts.test_classify_ci_changes scripts.test_build_python_release scripts.test_inspect_wheel scripts.test_release_config scripts.test_verify_python_release scripts.test_verify_perf_gates scripts.test_verify_stream_lifecycle_evidence scripts.test_verify_symbolic_milestone_perf scripts.test_write_criterion_provenance scripts.test_verify_complexity_gates scripts.test_verify_security_gates scripts.test_verify_sql_datafusion_performance scripts.test_analyze_sql_datafusion_attribution scripts.test_run_sql_datafusion_matrix
          python scripts/inspect_wheel.py core-wheel dist/*.whl
      - name: Smoke native wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m venv wheel-smoke
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            wheel_python="wheel-smoke/Scripts/python.exe"
          else
            wheel_python="wheel-smoke/bin/python"
          fi
          "${wheel_python}" -m pip install dist/*.whl
          "${wheel_python}" -m pip show calc-flow-python
          "${wheel_python}" scripts/smoke_wheel.py
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
  sdist:
    name: Python source distribution
    needs: acceptance-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          args: --out dist
      - name: Verify source distribution
        run: |
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          python scripts/inspect_wheel.py sdist "${archive}"
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
  studio-wheel:
    name: Studio wheel and static assets
    needs: acceptance-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Build core wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: x86_64
          args: --release --locked --out dist --find-interpreter
          manylinux: "2_28"
      - name: Build Studio static assets and wheel
        working-directory: web-ui
        run: |
          npm ci
          npm run build
          uv build --project backend --wheel --out-dir ../dist
      - name: Install and inspect local wheels
        run: |
          python scripts/inspect_wheel.py core-wheel dist/calc_flow_python-*.whl
          python scripts/inspect_wheel.py studio-wheel dist/calc_flow_studio-*.whl
          python -m venv studio-smoke
          python -m pip --python studio-smoke install dist/calc_flow_python-*.whl dist/calc_flow_studio-*.whl
          test -x studio-smoke/bin/calc-flow-web
          studio-smoke/bin/python - <<'PY'
          from importlib.metadata import requires
          from pathlib import Path

          import calc_flow_studio

          app = calc_flow_studio.create_app()
          paths = [route.path for route in app.routes]
          assert "/api/v3/catalog" in app.openapi()["paths"]
          assert "/" in paths
          assert "/assets" in paths
          requirements = requires("calc-flow-studio") or []
          assert any(
              requirement.lower().startswith("calc-flow-python")
              and ">=4.0.0" in requirement
              and "<5" in requirement
              for requirement in requirements
          )
          index = next(route for route in app.routes if route.path == "/").endpoint()
          assert Path(index.path).is_file()
          assert (Path(index.path).parent / "assets").is_dir()
          PY
      - name: Upload Studio wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-wheel
          path: dist/calc_flow_studio-*.whl
          if-no-files-found: error
          retention-days: 30
  audits:
    name: Dependency audits
    needs: prepare-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install locked Rust audit tools
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Run Rust audits
        run: |
          mkdir -p audit-reports
          cargo audit --ignore RUSTSEC-2026-0176 --ignore RUSTSEC-2026-0177 --ignore RUSTSEC-2026-0235
          cargo audit --ignore RUSTSEC-2026-0176 --ignore RUSTSEC-2026-0177 --ignore RUSTSEC-2026-0235 \
            --json > audit-reports/cargo-audit.json
          cargo deny --locked check
          cargo deny --locked --format json check 2> audit-reports/cargo-deny.json
          test -s audit-reports/cargo-audit.json
          test -s audit-reports/cargo-deny.json
      - name: Run production npm audit
        working-directory: web-ui
        run: |
          npm ci
          npm audit --omit=dev
          npm audit --omit=dev --json > ../audit-reports/npm-audit.json
          test -s ../audit-reports/npm-audit.json
      - name: Upload audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audits
          path: audit-reports/*.json
          if-no-files-found: error
          retention-days: 30
  verify-python-release:
    name: Verify Python release manifest
    needs:
      - crate
      - wheels
      - sdist
      - studio-wheel
      - audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Download core wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: release-dist/core
          merge-multiple: true
      - name: Download core source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: release-dist/core
      - name: Download Studio wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: studio-wheel
          path: release-dist/studio
      - name: Validate Python artifact matrix and metadata
        shell: bash
        run: |
          args=(--dist-dir release-dist)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}" --check-pypi)
          fi
          python scripts/verify_python_release.py "${args[@]}" \
            | tee release-dist/release-manifest.txt
      - name: Upload verified Python release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-python-release
          path: release-dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  publish-python-core:
    name: Publish calc-flow-python to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify-python-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/calc-flow-python/
    permissions:
      id-token: write
    steps:
      - name: Download verified Python release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-release
          path: release-dist
      - name: Verify exact release artifacts
        working-directory: release-dist
        shell: bash
        run: |
          sha256sum --check release-manifest.txt
          test "$(find core studio -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" \
            -eq "$(wc -l < release-manifest.txt)"
      - name: Publish exact core artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-dist/core
