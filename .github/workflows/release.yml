name: Python package release
on:
  workflow_dispatch:
  push:
    tags:
      - "calc-flow-python-v*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  prepare-python-release:
    name: Validate release version and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate version, tag, and PyPI availability
        shell: bash
        run: |
          args=(--version-only)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            git fetch --no-tags origin main
            test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
            test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
            args+=(--tag "${GITHUB_REF_NAME}" --check-pypi)
          fi
          python scripts/verify_python_release.py "${args[@]}"

  wheels:
    name: Wheel ${{ matrix.os }} ${{ matrix.target }} ${{ matrix.python_tag }}
    needs: prepare-python-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            python_tag: cp313
            manylinux: "2_28"
          - os: ubuntu-latest
            target: x86_64
            python_tag: cp39
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64
            python_tag: cp313
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64
            python_tag: cp39
            manylinux: "2_28"
          - os: macos-15-intel
            target: x86_64
            python_tag: cp313
            manylinux: "off"
          - os: macos-15-intel
            target: x86_64
            python_tag: cp39
            manylinux: "off"
          - os: macos-15
            target: aarch64
            python_tag: cp313
            manylinux: "off"
          - os: macos-15
            target: aarch64
            python_tag: cp39
            manylinux: "off"
          - os: windows-latest
            target: x64
            python_tag: cp313
            manylinux: "off"
          - os: windows-latest
            target: x64
            python_tag: cp39
            manylinux: "off"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build modern abi3 wheel
        if: matrix.python_tag == 'cp313'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter --features pyo3/abi3-py313
          manylinux: ${{ matrix.manylinux }}
      - name: Build legacy abi3 wheel
        if: matrix.python_tag == 'cp39'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          target: ${{ matrix.target }}
          args: --release --locked --out dist --find-interpreter --features legacy-python
          manylinux: ${{ matrix.manylinux }}
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.python_tag }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    name: Python source distribution
    needs: prepare-python-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: v1.14.1
          rust-toolchain: "1.88.0"
          args: --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  wheel-python-versions:
    name: Installed wheel unit tests (Python ${{ matrix.python_version }})
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.9"
            python_tag: cp39
          - python_version: "3.10"
            python_tag: cp39
          - python_version: "3.11"
            python_tag: cp39
          - python_version: "3.12"
            python_tag: cp39
          - python_version: "3.13"
            python_tag: cp313
          - python_version: "3.14"
            python_tag: cp313
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Download matching Linux wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-ubuntu-latest-x86_64-${{ matrix.python_tag }}
          path: dist
      - name: Run installed wheel unit tests
        run: |
          python -m pip install dist/*.whl pytest numpy
          python -m pytest -q \
            python/tests/test_import.py \
            python/tests/test_python_version_contract.py \
            python/tests/test_compute.py \
            python/tests/test_symbolic_expr.py \
            python/tests/test_stream_entrypoints.py \
            python/tests/test_execution_options.py \
            python/tests/test_batch.py \
            python/tests/test_config.py \
            python/tests/test_udf.py
      - name: Test Python 3.9 JAX array extra
        if: matrix.python_version == '3.9'
        run: |
          python -m pip install 'jax==0.4.30'
          JAX_PLATFORMS=cpu python -m pytest -q python/tests/test_array.py

  verify-core-artifacts:
    name: Verify Python package artifacts
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Download Linux, Windows, and macOS wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download core source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist
      - name: Verify wheel matrix, metadata, and source distribution
        shell: bash
        run: |
          args=(--dist-dir dist --core-only)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python scripts/verify_python_release.py "${args[@]}" > release-manifest.txt
      - name: Upload verified artifact manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-release-manifest
          path: release-manifest.txt
          if-no-files-found: error
          retention-days: 30

  publish-python-core:
    name: Publish calc-flow-python to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify-core-artifacts, wheel-python-versions]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/calc-flow-python/
    permissions:
      id-token: write
    steps:
      - name: Download Linux, Windows, and macOS wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download core source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist
      - name: Download verified artifact manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-manifest
      - name: Confirm artifact integrity
        run: sha256sum --check ../release-manifest.txt
        working-directory: dist
      - name: Publish core artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
