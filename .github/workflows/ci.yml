name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-test:
    name: Ruff + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run unit, property, and coverage tests
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 2
        run: >-
          uv run pytest -q -n auto --dist load -p no:benchmark
          --cov=calc_flow --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
  frontend:
    name: Studio build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build studio
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
  studio-backend:
    name: Studio backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install studio dependencies
        run: |
          uv sync --package calc-flow-studio --extra dev
          cd web-ui && npm ci
      - name: Run studio backend coverage
        working-directory: web-ui/backend
        run: >-
          uv run --project . --extra dev pytest -q
          --cov=calc_flow_studio --cov-report=term-missing --cov-report=xml
      - name: Verify generated API contract
        run: |
          cd web-ui
          npm run sync:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: Upload studio coverage report
        uses: actions/upload-artifact@v7
        with:
          name: studio-python-coverage
          path: web-ui/backend/coverage.xml
          if-no-files-found: error
          retention-days: 14
  browser-e2e:
    name: Studio browser workflow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install backend
        working-directory: .
        run: uv sync --package calc-flow-studio
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        run: npm run test:e2e
  package:
    name: Build + isolated wheel smoke test
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: |
          uv build
          ! tar -tzf dist/calc_flow-*.tar.gz | grep -E 'web-ui|calc_flow/web'
      - name: Install and execute the wheel in isolation
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel}"
          uv venv /tmp/calc-flow-wheel
          uv pip install --python /tmp/calc-flow-wheel/bin/python "${wheel}"
          /tmp/calc-flow-wheel/bin/python - <<'PY'
          import pyarrow as pa
          from calc_flow import Batch, ExpressionOperator, Pipeline

          result = (
              Pipeline("wheel-smoke")
              .then(ExpressionOperator("calculate", "total = a + b"))
              .execute({"input": Batch.table(pa.table({"a": [1], "b": [2]}))})
          )
          assert result.output.table_payload["total"].to_pylist() == [3]
          PY
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  studio-package:
    name: Build + isolated studio wheel smoke test
    needs:
      - frontend
      - studio-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Build core and studio wheels
        run: |
          uv build
          cd web-ui
          npm ci
          npm run build:wheel
      - name: Install and inspect studio wheels
        run: |
          uv venv /tmp/calc-flow-studio-wheel
          uv pip install --python /tmp/calc-flow-studio-wheel/bin/python \
            dist/calc_flow-*.whl dist/calc_flow_studio-*.whl
          test -x /tmp/calc-flow-studio-wheel/bin/calc-flow-web
          /tmp/calc-flow-studio-wheel/bin/python - <<'PY'
          from importlib.metadata import requires
          from pathlib import Path

          import calc_flow
          import calc_flow_studio

          app = calc_flow_studio.create_app()
          paths = [route.path for route in app.routes]
          assert "/api/v1/catalog" in app.openapi()["paths"]
          assert "/" in paths
          assert "/assets" in paths
          assert not hasattr(calc_flow, "web")
          core_requirements = requires("calc-flow") or []
          assert not any("fastapi" in item.lower() for item in core_requirements)
          assert not any("uvicorn" in item.lower() for item in core_requirements)
          index = next(route for route in app.routes if route.path == "/").endpoint()
          assert Path(index.path).is_file()
          PY
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: studio-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  benchmark-smoke:
    name: Informational benchmark smoke
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install benchmark dependencies
        run: uv sync --extra benchmark
      - name: Run deterministic overhead benchmarks
        env:
          CALC_FLOW_BENCHMARK_SCALE: overhead
          JAX_PLATFORMS: cpu
        run: |
          mkdir -p benchmark-results
          uv run pytest benchmarks -q --benchmark-only \
            --benchmark-json=benchmark-results/smoke.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke
          path: benchmark-results/smoke.json
          if-no-files-found: error
          retention-days: 30
  rust-core:
    name: Rust core parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,llvm-tools-preview,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Enforce Rust core line coverage
        run: >-
          cargo llvm-cov --workspace --all-features --fail-under-lines 90
          --lcov --output-path rust-lcov.info
      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: rust-lcov.info
          if-no-files-found: error
          retention-days: 14
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
