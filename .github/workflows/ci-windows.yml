name: Windows CI
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel default-branch runs: a cancelled latest run renders the
  # README CI badge as failing even when every job was healthy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  probe-windows-locking:
    name: TEMP probe Windows directory locking
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - shell: bash
        run: |
          probe="$RUNNER_TEMP/lock-probe"
          mkdir -p "$probe/src"
          cat > "$probe/Cargo.toml" <<'TOML'
          [package]
          name = "lock-probe"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          fs2 = "=0.4.3"
          TOML
          cat > "$probe/src/main.rs" <<'RS'
          use fs2::FileExt;
          use std::fs::{self, File, OpenOptions};
          use std::os::windows::fs::OpenOptionsExt as _;

          const FILE_FLAG_BACKUP_SEMANTICS: u32 = 0x0200_0000;

          fn lock_report(label: &str, result: std::io::Result<()>) {
              match result {
                  Ok(()) => println!("{label} -> ok"),
                  Err(error) => println!(
                      "{label} -> raw={:?} kind={:?}",
                      error.raw_os_error(),
                      error.kind()
                  ),
              }
          }

          fn main() {
              let base = std::env::temp_dir().join("calc-flow-lock-probe-2");
              let _ = fs::remove_dir_all(&base);
              fs::create_dir_all(&base).unwrap();
              let canonical = fs::canonicalize(&base).unwrap();
              println!("canonical root: {}", canonical.display());

              // read + backup semantics (current implementation)
              let read_only = OpenOptions::new()
                  .read(true)
                  .custom_flags(FILE_FLAG_BACKUP_SEMANTICS)
                  .open(&canonical)
                  .unwrap();
              lock_report("dir read-only  shared   ", read_only.try_lock_shared());

              // read + write + backup semantics
              let read_write = OpenOptions::new()
                  .read(true)
                  .write(true)
                  .custom_flags(FILE_FLAG_BACKUP_SEMANTICS)
                  .open(&canonical)
                  .unwrap();
              lock_report("dir read-write shared   ", read_write.try_lock_shared());
              lock_report("dir read-write exclusive", read_write.try_lock_exclusive());

              // contended regular-file lock: what kind does a conflict map to?
              let lease = canonical.join("lease-file");
              let first = OpenOptions::new()
                  .read(true)
                  .write(true)
                  .create(true)
                  .open(&lease)
                  .unwrap();
              lock_report("file first exclusive   ", first.try_lock_exclusive());
              let second = OpenOptions::new()
                  .read(true)
                  .write(true)
                  .open(&lease)
                  .unwrap();
              lock_report("file contended exclusive", second.try_lock_exclusive());
              let third = File::open(&lease).unwrap();
              lock_report("file contended shared  ", third.try_lock_shared());
          }
          RS
          cd "$probe"
          cargo run --release 2>&1 | tail -30
  process-tree:
    name: Windows process-tree cleanup
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Report Windows runner
        shell: pwsh
        run: |
          Write-Output "WINDOWS_RUNNER_EVIDENCE runner_os=$env:RUNNER_OS image_os=$env:ImageOS image_version=$env:ImageVersion"
      - name: Run Windows process-tree cleanup test
        run: >-
          python -W error::ResourceWarning -m unittest -v
          scripts.test_run_rust_tests.RustTestHarnessTests.test_timeout_cleans_up_the_test_binary_process_tree_on_windows
  rust-and-python:
    name: Rust + Python tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: 2
      RUST_TEST_THREADS: 1
      JAX_PLATFORMS: cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install compatible Python test dependencies
        run: python -m pip install "numpy>=2.0.0" "pyarrow==24.0.0"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Rust tests
        timeout-minutes: 60
        run: python scripts/run_rust_tests.py --python-stress-runs 1
      - name: Run Python tests
        run: uv run pytest -q -n auto --dist load -p no:benchmark
