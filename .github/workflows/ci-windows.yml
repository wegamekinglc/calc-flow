name: Windows CI
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/classify_ci_changes.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  process-tree:
    name: Windows process-tree cleanup
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Report Windows runner
        shell: pwsh
        run: |
          Write-Output "WINDOWS_RUNNER_EVIDENCE runner_os=$env:RUNNER_OS image_os=$env:ImageOS image_version=$env:ImageVersion"
      - name: Run Windows process-tree cleanup test
        run: >-
          python -W error::ResourceWarning -m unittest -v
          scripts.test_run_rust_tests.RustTestHarnessTests.test_timeout_cleans_up_the_test_binary_process_tree_on_windows
  # The Rust and Python legs used to share one job, so the pytest suite sat
  # behind the maturin build for the whole Rust harness. They build disjoint
  # artifacts, so run them as parallel jobs; the harness serializes the
  # embedded-Python lib test itself. Keep the core suite parallel, with the
  # checkpoint soak module isolated below.
  rust-tests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install compatible Python test dependencies
        run: python -m pip install "numpy>=2.0.0" "pyarrow==24.0.0"
      - uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      # Checkpoint fault/restart cases perform durable filesystem I/O; parallel
      # Windows execution can expire their five-second checkpoint deadline
      # before reaching the injected fault. The same module's generation forks
      # also amplify contention (DAL-255/DAL-261). Run this module serially
      # after the parallel suite, preserving every test and its deadlines.
      # The four bounded checkpoint regressions below also stage durable
      # files before acknowledgement. Isolate their exact names while
      # retaining the original five/ten-second deadlines and assertions.
      - name: Run Rust tests
        timeout-minutes: 50
        run: >-
          python scripts/run_rust_tests.py --python-stress-runs 1
          --lib-skip runtime::streaming::soak::
          --lib-skip runtime::streaming::operator_task::tests::asof_tests::test_asof_idle_never_forwards_with_or_without_pending_left
          --lib-skip runtime::streaming::operator_task::tests::asof_tests::test_asof_minimum_watermark_has_no_underflow_and_maximum_requires_eof
          --lib-skip runtime::streaming::runner::tests::asof_tests::test_asof_collector_backpressure_cancellation_restores_last_published_pending_cut
          --lib-skip runtime::streaming::runner::tests::ac5_checkpoint_restore_preserves_the_join_window_result
      - name: Run checkpoint regressions serially
        timeout-minutes: 5
        run: >-
          cargo test --locked -p calc-flow --lib --all-features --
          runtime::streaming::operator_task::tests::asof_tests::test_asof_idle_never_forwards_with_or_without_pending_left
          runtime::streaming::operator_task::tests::asof_tests::test_asof_minimum_watermark_has_no_underflow_and_maximum_requires_eof
          runtime::streaming::runner::tests::asof_tests::test_asof_collector_backpressure_cancellation_restores_last_published_pending_cut
          runtime::streaming::runner::tests::ac5_checkpoint_restore_preserves_the_join_window_result
          --exact --test-threads=1
      - name: Run checkpoint soak tests serially
        timeout-minutes: 10
        shell: pwsh
        env:
          CALC_FLOW_CHECKPOINT_SMOKE_ARTIFACTS: ${{ github.workspace }}/target/checkpoint-smoke-evidence
          SMOKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $smokeRoot = $env:CALC_FLOW_CHECKPOINT_SMOKE_ARTIFACTS
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          @{
            checkout_sha = (git rev-parse HEAD)
            head_sha = $env:SMOKE_HEAD_SHA
            base_sha = $env:SMOKE_BASE_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json | Set-Content "$smokeRoot/checkout.json"
          cargo test -p calc-flow --lib --all-features runtime::streaming::soak:: -- --test-threads=1 1> "$smokeRoot/parent.stdout" 2> "$smokeRoot/parent.stderr"
          $smokeExitCode = $LASTEXITCODE
          @{ exit_code = $smokeExitCode } | ConvertTo-Json | Set-Content "$smokeRoot/exit.json"
          Get-Content "$smokeRoot/parent.stdout"
          Get-Content "$smokeRoot/parent.stderr"
          exit $smokeExitCode
      - name: Upload checkpoint smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkpoint-smoke-windows-${{ github.run_attempt }}
          path: target/checkpoint-smoke-evidence
          include-hidden-files: true
          if-no-files-found: warn
  python-tests:
    name: Python tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      JAX_PLATFORMS: cpu
      PYTEST_XDIST_AUTO_NUM_WORKERS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Python tests
        run: >-
          uv run pytest -q -n auto --dist load -p no:benchmark
          python/tests
  # Clippy otherwise runs only on Linux CI, so cfg-gated code compiled out on
  # Linux (unix fsync stubs, Linux /proc soak evidence) regressed on Windows
  # unnoticed (DAL-167). Keep the gate scoped to the lint surface that carries
  # platform cfg code; kafka stays out because rdkafka-sys needs a native
  # cmake build that no cfg lint justifies paying for here.
  clippy:
    name: Clippy (Windows cfg parity)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@dc08e2af391d489dff6d14cf743e574f7d1229c5 # 1.94.0
        with:
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Run Windows clippy (calc-flow)
        run: cargo clippy -p calc-flow --lib --bins --tests --examples --all-features -- -D warnings
      - name: Run Windows clippy (connectors, non-kafka)
        run: >-
          cargo clippy -p calc-flow-connectors --lib --bins --tests --examples
          --no-default-features --features file,clickhouse,http,websocket,postgresql,mysql
          -- -D warnings
  windows-gate:
    name: Windows CI gate
    if: always()
    needs:
      - changes
      - process-tree
      - rust-tests
      - python-tests
      - clippy
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      PROCESS_TREE_RESULT: ${{ needs.process-tree.result }}
      RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
      PYTHON_TESTS_RESULT: ${{ needs.python-tests.result }}
      CLIPPY_RESULT: ${{ needs.clippy.result }}
    steps:
      - name: Require the selected CI path to pass
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            exit 0
          fi
          test "$PROCESS_TREE_RESULT" = success
          test "$RUST_TESTS_RESULT" = success
          test "$PYTHON_TESTS_RESULT" = success
          test "$CLIPPY_RESULT" = success
