name: Windows CI
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel default-branch runs: a cancelled latest run renders the
  # README CI badge as failing even when every job was healthy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  probe-windows-createdir:
    name: TEMP probe Windows create_dir_all behavior
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - shell: bash
        run: |
          probe="$RUNNER_TEMP/createdir-probe"
          mkdir -p "$probe/src"
          cat > "$probe/Cargo.toml" <<'TOML'
          [package]
          name = "createdir-probe"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          tempfile = "3"
          TOML
          cat > "$probe/src/main.rs" <<'RS'
          use std::fs;
          use std::io::Write as _;

          fn main() {
              for i in 0..20 {
                  let directory = tempfile::tempdir().unwrap();
                  let artifact = directory.path().join("m5-checkpoint-benchmark");
                  match fs::create_dir_all(&artifact) {
                      Ok(()) => println!("iter {i}: create_dir_all ok"),
                      Err(error) => println!(
                          "iter {i}: create_dir_all FAIL raw={:?} kind={:?} path={}",
                          error.raw_os_error(),
                          error.kind(),
                          artifact.display()
                      ),
                  }
                  let report = artifact.join("aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-run-1.json");
                  let written = fs::OpenOptions::new()
                      .create_new(true)
                      .write(true)
                      .open(&report)
                      .and_then(|mut file| file.write_all(b"{}").and_then(|()| file.sync_all()));
                  println!("iter {i}: write -> {:?}", written.is_ok());
              }

              let directory = tempfile::tempdir().unwrap();
              let canonical = fs::canonicalize(directory.path()).unwrap();
              let artifact = canonical.join("m5-checkpoint-benchmark");
              let result = fs::create_dir_all(&artifact);
              println!("canonical create_dir_all -> {:?}", result.is_ok());
          }
          RS
          cd "$probe"
          cargo run --release 2>&1 | tail -45
  process-tree:
    name: Windows process-tree cleanup
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Report Windows runner
        shell: pwsh
        run: |
          Write-Output "WINDOWS_RUNNER_EVIDENCE runner_os=$env:RUNNER_OS image_os=$env:ImageOS image_version=$env:ImageVersion"
      - name: Run Windows process-tree cleanup test
        run: >-
          python -W error::ResourceWarning -m unittest -v
          scripts.test_run_rust_tests.RustTestHarnessTests.test_timeout_cleans_up_the_test_binary_process_tree_on_windows
  rust-and-python:
    name: Rust + Python tests
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: 2
      RUST_TEST_THREADS: 1
      JAX_PLATFORMS: cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install compatible Python test dependencies
        run: python -m pip install "numpy>=2.0.0" "pyarrow==24.0.0"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Rust tests
        timeout-minutes: 60
        run: python scripts/run_rust_tests.py --python-stress-runs 1
      - name: Run Python tests
        run: uv run pytest -q -n auto --dist load -p no:benchmark
