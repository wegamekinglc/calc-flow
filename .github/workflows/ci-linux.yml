name: Linux CI
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/classify_ci_changes.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  docs-check:
    name: Documentation checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  connector-containers:
    name: Connector containers (Kafka)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        # Official KRaft image; its default listener advertises
        # localhost:9092, which is exactly what the job connects to.
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CALC_FLOW_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Ensure libcurl headers for vendored librdkafka
        run: |
          if dpkg-query -W -f='${Status}' libcurl4-openssl-dev 2>/dev/null \
            | grep -qx 'install ok installed'; then
            exit 0
          fi
          install_libcurl_headers() {
            timeout 5m sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              install --no-install-recommends -y libcurl4-openssl-dev
          }
          if ! install_libcurl_headers; then
            timeout 2m sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            install_libcurl_headers
          fi
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Wait for the broker to accept connections
        run: |
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/localhost/9092' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "broker never became reachable" >&2
          exit 1
      - name: Run gated Kafka connector tests
        run: >-
          cargo test -p calc-flow-connectors --features kafka
          --test kafka_connector -- --ignored --test-threads=1

  connector-containers-pg:
    name: Connector containers (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CALC_FLOW_PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Enable logical replication for CDC tests
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET wal_level = 'logical'" \
            -c "ALTER SYSTEM SET max_replication_slots = 10" \
            -c "ALTER SYSTEM SET max_wal_senders = 10"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL never became ready after enabling logical replication" >&2
          exit 1
      - name: Run gated PostgreSQL connector tests
        run: >-
          cargo test -p calc-flow-connectors --features postgresql
          --test postgresql_connector --test postgresql_cdc
          -- --ignored --test-threads=1

  connector-containers-ch:
    name: Connector containers (ClickHouse)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.12
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CH_TEST_URL: http://localhost:8123
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Run gated ClickHouse connector tests
        run: >-
          cargo test -p calc-flow-connectors --features clickhouse
          --test clickhouse_connector -- --ignored --test-threads=1
  lint-and-test:
    name: Ruff + unit tests
    needs:
      - changes
      - package
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Download core distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Install dependencies
        run: |
          uv sync --extra dev --no-install-workspace
          uv pip install --python .venv/bin/python --no-deps dist/calc_flow-*.whl
      - name: Run Ruff
        run: uv run --no-sync ruff check .
      - name: Verify complexity gates
        run: uv run --no-sync python scripts/verify_complexity_gates.py
      - name: Run unit, property, and coverage tests
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 2
        run: >-
          uv run --no-sync pytest -q -n auto --dist load -p no:benchmark
          --cov=calc_flow --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Report Python coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: python
          format: cobertura
          file: coverage.xml
          parallel: true
  frontend:
    name: Studio build + tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build studio
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
  studio-backend:
    name: Studio backend tests
    needs:
      - changes
      - package
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Download core distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Install studio dependencies
        run: |
          uv sync --package calc-flow-studio --extra dev --no-install-workspace
          uv pip install --python .venv/bin/python --no-deps dist/calc_flow-*.whl
          uv pip install --python .venv/bin/python --no-deps --editable web-ui/backend
          cd web-ui && npm ci
      - name: Run studio backend coverage
        working-directory: web-ui/backend
        run: >-
          uv run --no-sync --project . pytest -q
          --cov=calc_flow_studio --cov-report=term-missing --cov-report=xml
      - name: Verify generated API contract
        run: |
          uv run --no-sync --project web-ui/backend \
            python web-ui/scripts/export_openapi.py
          npm --prefix web-ui run generate:api
          git diff --exit-code -- web-ui/openapi.json web-ui/src/api/schema.d.ts
      - name: Upload studio coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-python-coverage
          path: web-ui/backend/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Report studio coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: studio
          format: cobertura
          file: web-ui/backend/coverage.xml
          parallel: true
  browser-e2e:
    name: Studio browser workflow
    needs:
      - changes
      - package
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Download core distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Install backend
        working-directory: .
        run: |
          uv sync --package calc-flow-studio --no-install-workspace
          uv pip install --python .venv/bin/python --no-deps dist/calc_flow-*.whl
          uv pip install --python .venv/bin/python --no-deps --editable web-ui/backend
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web-ui/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        run: npm run test:e2e
  package:
    name: Build + isolated wheel smoke test
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: |
          python -m unittest scripts.test_generate_rolling_kernel_manifest scripts.test_run_rust_tests scripts.test_run_rust_coverage scripts.test_classify_ci_changes scripts.test_build_python_release scripts.test_inspect_wheel scripts.test_release_config scripts.test_verify_python_release scripts.test_verify_perf_gates scripts.test_verify_stream_lifecycle_evidence scripts.test_verify_symbolic_milestone_perf scripts.test_write_criterion_provenance scripts.test_verify_complexity_gates scripts.test_verify_security_gates
          uv build
          python scripts/inspect_wheel.py core-wheel dist/calc_flow-*.whl
          python scripts/inspect_wheel.py sdist dist/calc_flow-*.tar.gz
      - name: Install and execute the wheel in isolation
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel}"
          uv venv /tmp/calc-flow-wheel
          uv pip install --python /tmp/calc-flow-wheel/bin/python "${wheel}"
          /tmp/calc-flow-wheel/bin/python scripts/smoke_wheel.py
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  studio-package:
    name: Build + isolated studio wheel smoke test
    needs:
      - changes
      - package
      - frontend
      - studio-backend
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Download core distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Build studio wheel
        run: |
          npm --prefix web-ui ci
          npm --prefix web-ui run build
          uv build --project web-ui/backend --wheel --out-dir dist
      - name: Install and inspect studio wheels
        run: |
          uv venv /tmp/calc-flow-studio-wheel
          uv pip install --python /tmp/calc-flow-studio-wheel/bin/python \
            dist/calc_flow-*.whl dist/calc_flow_studio-*.whl
          test -x /tmp/calc-flow-studio-wheel/bin/calc-flow-web
          /tmp/calc-flow-studio-wheel/bin/python - <<'PY'
          from importlib.metadata import requires
          from pathlib import Path

          import calc_flow
          import calc_flow_studio

          app = calc_flow_studio.create_app()
          paths = [route.path for route in app.routes]
          assert "/api/v3/catalog" in app.openapi()["paths"]
          assert "/" in paths
          assert "/assets" in paths
          assert not hasattr(calc_flow, "web")
          core_requirements = requires("calc-flow") or []
          studio_requirements = requires("calc-flow-studio") or []
          assert not any("fastapi" in item.lower() for item in core_requirements)
          assert not any("uvicorn" in item.lower() for item in core_requirements)
          assert any(
              item.lower().startswith("calc-flow")
              and ">=4.0.0" in item
              and "<5" in item
              for item in studio_requirements
          )
          index = next(route for route in app.routes if route.path == "/").endpoint()
          assert Path(index.path).is_file()
          PY
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-python-distributions
          path: dist/calc_flow_studio-*.whl
          if-no-files-found: error
          retention-days: 30
  benchmark-smoke:
    name: Informational overhead benchmark smoke
    needs:
      - changes
      - package
      - lint-and-test
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CALC_FLOW_BENCHMARK_SCALE: overhead
      JAX_PLATFORMS: cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Download core distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Install benchmark dependencies
        run: |
          uv sync --extra benchmark --no-install-workspace
          uv pip install --python .venv/bin/python --no-deps dist/calc_flow-*.whl
      - name: Run benchmark scale
        run: |
          mkdir -p benchmark-results
          uv run --no-sync pytest benchmarks -q --benchmark-only \
            -m "not stream_lifecycle" \
            --benchmark-json="benchmark-results/overhead.json"
      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-smoke-overhead
          path: benchmark-results/overhead.json
          if-no-files-found: error
          retention-days: 30
  stream-lifecycle-smoke:
    name: Isolated stream lifecycle evidence smoke
    needs:
      - changes
      - package
      - lint-and-test
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CALC_FLOW_BENCHMARK_SCALE: overhead
      JAX_PLATFORMS: cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Download core distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Install benchmark dependencies
        run: |
          uv sync --extra benchmark --no-install-workspace
          uv pip install --python .venv/bin/python --no-deps dist/calc_flow-*.whl
      - name: Run isolated lifecycle benchmark
        run: |
          mkdir -p benchmark-results
          uv run --no-sync pytest \
            benchmarks/test_symbolic_baseline.py::test_stream_window_checkpoint_and_recovery \
            -q --benchmark-only \
            --benchmark-json="benchmark-results/stream-lifecycle.json"
      - name: Validate lifecycle evidence contract
        run: >-
          uv run --no-sync python scripts/verify_stream_lifecycle_evidence.py
          benchmark-results/stream-lifecycle.json --minimum-rounds 20
      - name: Upload stream lifecycle report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-stream-lifecycle-smoke
          path: benchmark-results/stream-lifecycle.json
          if-no-files-found: error
          retention-days: 30
  rust-core:
    name: Rust core parity
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Ensure libcurl headers for vendored librdkafka
        # librdkafka 2.12's cmake path includes curl/curl.h even with
        # WITH_CURL=0 (rust-rdkafka#829); the headers satisfy the stale
        # include without linking curl.
        run: |
          if dpkg-query -W -f='${Status}' libcurl4-openssl-dev 2>/dev/null \
            | grep -qx 'install ok installed'; then
            exit 0
          fi
          install_libcurl_headers() {
            timeout 5m sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              install --no-install-recommends -y libcurl4-openssl-dev
          }
          if ! install_libcurl_headers; then
            timeout 2m sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            install_libcurl_headers
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install compatible Python test dependencies
        run: python -m pip install "numpy>=2.0.0" "pyarrow==24.0.0"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
        with:
          components: clippy,rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        timeout-minutes: 30
        run: python3.13 scripts/run_rust_tests.py --python-stress-runs 3
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
  rust-coverage:
    name: Rust combined coverage
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.12
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CALC_FLOW_KAFKA_BOOTSTRAP: localhost:9092
      CALC_FLOW_PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CH_TEST_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Ensure libcurl headers for vendored librdkafka
        run: |
          if dpkg-query -W -f='${Status}' libcurl4-openssl-dev 2>/dev/null \
            | grep -qx 'install ok installed'; then
            exit 0
          fi
          install_libcurl_headers() {
            timeout 5m sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              install --no-install-recommends -y libcurl4-openssl-dev
          }
          if ! install_libcurl_headers; then
            timeout 2m sudo apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            install_libcurl_headers
          fi
      - name: Wait for Kafka and enable PostgreSQL logical replication
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/localhost/9092' 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "broker never became reachable" >&2
              exit 1
            fi
            sleep 1
          done
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET wal_level = 'logical'" \
            -c "ALTER SYSTEM SET max_replication_slots = 10" \
            -c "ALTER SYSTEM SET max_wal_senders = 10"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL never became ready after enabling logical replication" >&2
          exit 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install compatible Python test dependencies
        run: python -m pip install "numpy>=2.0.0" "pyarrow==24.0.0"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
        with:
          components: llvm-tools-preview
      - name: Install Rust coverage tool
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Enforce combined Rust and connector line coverage
        run: python3.13 scripts/run_rust_coverage.py
      - name: Upload Rust coverage report
        if: ${{ always() && hashFiles('rust-lcov.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: rust-lcov.info
          if-no-files-found: error
          retention-days: 14
      - name: Report Rust coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: rust
          file: rust-lcov.info
          parallel: true
  rust-supply-chain:
    name: Rust dependency policy
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install locked audit tools
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Check RustSec advisories
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0176
          --ignore RUSTSEC-2026-0177
          --ignore RUSTSEC-2026-0235
      - name: Check licenses, sources, advisories, and duplicate policy
        run: cargo deny --locked check
  coveralls-finish:
    name: Coveralls finish
    needs:
      - changes
      - lint-and-test
      - studio-backend
      - rust-coverage
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Close the parallel Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
  linux-gate:
    name: Linux CI gate
    if: always()
    needs:
      - changes
      - docs-check
      - connector-containers
      - connector-containers-pg
      - connector-containers-ch
      - lint-and-test
      - frontend
      - studio-backend
      - browser-e2e
      - package
      - studio-package
      - benchmark-smoke
      - stream-lifecycle-smoke
      - rust-core
      - rust-coverage
      - rust-supply-chain
      - coveralls-finish
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_RESULT: ${{ needs.docs-check.result }}
      CONNECTOR_KAFKA_RESULT: ${{ needs.connector-containers.result }}
      CONNECTOR_PG_RESULT: ${{ needs.connector-containers-pg.result }}
      CONNECTOR_CH_RESULT: ${{ needs.connector-containers-ch.result }}
      LINT_RESULT: ${{ needs.lint-and-test.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      STUDIO_BACKEND_RESULT: ${{ needs.studio-backend.result }}
      BROWSER_RESULT: ${{ needs.browser-e2e.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      STUDIO_PACKAGE_RESULT: ${{ needs.studio-package.result }}
      BENCHMARK_RESULT: ${{ needs.benchmark-smoke.result }}
      STREAM_LIFECYCLE_RESULT: ${{ needs.stream-lifecycle-smoke.result }}
      RUST_CORE_RESULT: ${{ needs.rust-core.result }}
      RUST_COVERAGE_RESULT: ${{ needs.rust-coverage.result }}
      RUST_SUPPLY_CHAIN_RESULT: ${{ needs.rust-supply-chain.result }}
      COVERALLS_RESULT: ${{ needs.coveralls-finish.result }}
    steps:
      - name: Require the selected CI path to pass
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            exit 0
          fi
          for result in \
            "$CONNECTOR_KAFKA_RESULT" \
            "$CONNECTOR_PG_RESULT" \
            "$CONNECTOR_CH_RESULT" \
            "$LINT_RESULT" \
            "$FRONTEND_RESULT" \
            "$STUDIO_BACKEND_RESULT" \
            "$BROWSER_RESULT" \
            "$PACKAGE_RESULT" \
            "$STUDIO_PACKAGE_RESULT" \
            "$BENCHMARK_RESULT" \
            "$STREAM_LIFECYCLE_RESULT" \
            "$RUST_CORE_RESULT" \
            "$RUST_COVERAGE_RESULT" \
            "$RUST_SUPPLY_CHAIN_RESULT" \
            "$COVERALLS_RESULT"; do
            test "$result" = success
          done
