name: Linux CI
on:
  pull_request:
  push:
    branches:
      - main
      - master
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel default-branch runs: a cancelled latest run renders the
  # README CI badge as failing even when every job was healthy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  connector-containers:
    name: Connector containers (Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      kafka:
        # Official KRaft image; its default listener advertises
        # localhost:9092, which is exactly what the job connects to.
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CALC_FLOW_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Ensure libcurl headers for vendored librdkafka
        run: |
          if dpkg-query -W -f='${Status}' libcurl4-openssl-dev 2>/dev/null \
            | grep -qx 'install ok installed'; then
            exit 0
          fi
          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install --no-install-recommends -y libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Wait for the broker to accept connections
        run: |
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/localhost/9092' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "broker never became reachable" >&2
          exit 1
      - name: Run gated Kafka connector tests
        run: >-
          cargo test -p calc-flow-connectors --features kafka
          --test kafka_connector -- --ignored --test-threads=1

  connector-containers-pg:
    name: Connector containers (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CALC_FLOW_PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Enable logical replication for CDC tests
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET wal_level = 'logical'" \
            -c "ALTER SYSTEM SET max_replication_slots = 10" \
            -c "ALTER SYSTEM SET max_wal_senders = 10"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL never became ready after enabling logical replication" >&2
          exit 1
      - name: Run gated PostgreSQL connector tests
        run: >-
          cargo test -p calc-flow-connectors --features postgresql
          --test postgresql_connector --test postgresql_cdc
          -- --ignored --test-threads=1

  connector-containers-ch:
    name: Connector containers (ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.12
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CH_TEST_URL: http://localhost:8123
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Run gated ClickHouse connector tests
        run: >-
          cargo test -p calc-flow-connectors --features clickhouse
          --test clickhouse_connector -- --ignored --test-threads=1
  lint-and-test:
    name: Ruff + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run unit, property, and coverage tests
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 2
        run: >-
          uv run pytest -q -n auto --dist load -p no:benchmark
          --cov=calc_flow --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Report Python coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: python
          format: cobertura
          file: coverage.xml
          parallel: true
  frontend:
    name: Studio build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build studio
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
  studio-backend:
    name: Studio backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install studio dependencies
        run: |
          uv sync --package calc-flow-studio --extra dev
          cd web-ui && npm ci
      - name: Run studio backend coverage
        working-directory: web-ui/backend
        run: >-
          uv run --project . --extra dev pytest -q
          --cov=calc_flow_studio --cov-report=term-missing --cov-report=xml
      - name: Verify generated API contract
        run: |
          cd web-ui
          npm run sync:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: Upload studio coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-python-coverage
          path: web-ui/backend/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Report studio coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: studio
          format: cobertura
          file: web-ui/backend/coverage.xml
          parallel: true
  browser-e2e:
    name: Studio browser workflow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install backend
        working-directory: .
        run: uv sync --package calc-flow-studio
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web-ui/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        run: npm run test:e2e
  package:
    name: Build + isolated wheel smoke test
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: |
          python -m unittest scripts.test_run_rust_tests scripts.test_run_rust_coverage scripts.test_inspect_wheel scripts.test_release_config scripts.test_verify_perf_gates scripts.test_verify_security_gates
          uv build
          python scripts/inspect_wheel.py core-wheel dist/calc_flow-*.whl
          python scripts/inspect_wheel.py sdist dist/calc_flow-*.tar.gz
      - name: Install and execute the wheel in isolation
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel}"
          uv venv /tmp/calc-flow-wheel
          uv pip install --python /tmp/calc-flow-wheel/bin/python "${wheel}"
          /tmp/calc-flow-wheel/bin/python scripts/smoke_wheel.py
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  studio-package:
    name: Build + isolated studio wheel smoke test
    needs:
      - frontend
      - studio-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Build core and studio wheels
        run: |
          uv build
          cd web-ui
          npm ci
          npm run build:wheel
      - name: Install and inspect studio wheels
        run: |
          uv venv /tmp/calc-flow-studio-wheel
          uv pip install --python /tmp/calc-flow-studio-wheel/bin/python \
            dist/calc_flow-*.whl dist/calc_flow_studio-*.whl
          test -x /tmp/calc-flow-studio-wheel/bin/calc-flow-web
          /tmp/calc-flow-studio-wheel/bin/python - <<'PY'
          from importlib.metadata import requires
          from pathlib import Path

          import calc_flow
          import calc_flow_studio

          app = calc_flow_studio.create_app()
          paths = [route.path for route in app.routes]
          assert "/api/v3/catalog" in app.openapi()["paths"]
          assert "/" in paths
          assert "/assets" in paths
          assert not hasattr(calc_flow, "web")
          core_requirements = requires("calc-flow") or []
          studio_requirements = requires("calc-flow-studio") or []
          assert not any("fastapi" in item.lower() for item in core_requirements)
          assert not any("uvicorn" in item.lower() for item in core_requirements)
          assert any(
              item.lower().startswith("calc-flow")
              and ">=3.0.0" in item
              and "<4" in item
              for item in studio_requirements
          )
          index = next(route for route in app.routes if route.path == "/").endpoint()
          assert Path(index.path).is_file()
          PY
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: studio-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  benchmark-smoke:
    name: Informational ${{ matrix.scale }} benchmark smoke
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scale: [overhead, small, standard, nightly]
    env:
      CALC_FLOW_BENCHMARK_SCALE: ${{ matrix.scale }}
      JAX_PLATFORMS: cpu
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install benchmark dependencies
        run: uv sync --extra benchmark
      - name: Run benchmark scale
        run: |
          mkdir -p benchmark-results
          uv run pytest benchmarks -q --benchmark-only \
            --benchmark-json="benchmark-results/${CALC_FLOW_BENCHMARK_SCALE}.json"
      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-smoke-${{ matrix.scale }}
          path: benchmark-results/${{ matrix.scale }}.json
          if-no-files-found: error
          retention-days: 30
  rust-core:
    name: Rust core parity
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.12
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CALC_FLOW_CONNECTOR_CONTAINERS: "1"
      CALC_FLOW_KAFKA_BOOTSTRAP: localhost:9092
      CALC_FLOW_PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CH_TEST_URL: http://localhost:8123
      FROZEN_ALLOCATION_CANDIDATE_TARGET_DIR: ${{ github.workspace }}/target/frozen-allocation-candidate
      FROZEN_ALLOCATION_HARNESS_SHA: "fe34d7dcd5bfd66c9e97c79d540380f58ee1a04d"
      FROZEN_ALLOCATION_HARNESS_TARGET_DIR: ${{ github.workspace }}/target/frozen-allocation-harness
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Ensure libcurl headers for vendored librdkafka
        # librdkafka 2.12's cmake path includes curl/curl.h even with
        # WITH_CURL=0 (rust-rdkafka#829); the headers satisfy the stale
        # include without linking curl.
        run: |
          if dpkg-query -W -f='${Status}' libcurl4-openssl-dev 2>/dev/null \
            | grep -qx 'install ok installed'; then
            exit 0
          fi
          timeout 5m sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install --no-install-recommends -y libcurl4-openssl-dev
      - name: Wait for Kafka and enable PostgreSQL logical replication
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for attempt in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/localhost/9092' 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "broker never became reachable" >&2
              exit 1
            fi
            sleep 1
          done
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET wal_level = 'logical'" \
            -c "ALTER SYSTEM SET max_replication_slots = 10" \
            -c "ALTER SYSTEM SET max_wal_senders = 10"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL never became ready after enabling logical replication" >&2
          exit 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install compatible Python test dependencies
        run: python -m pip install "numpy>=2.0.0" "pyarrow==24.0.0"
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
        with:
          components: clippy,llvm-tools-preview,rustfmt
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Detect frozen allocation harness
        id: frozen_allocation_harness
        run: |
          if git merge-base --is-ancestor "$FROZEN_ALLOCATION_HARNESS_SHA" HEAD; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Rust tests
        timeout-minutes: 30
        run: python3.13 scripts/run_rust_tests.py --python-stress-runs 3
      - name: Verify frozen allocation harness
        if: steps.frozen_allocation_harness.outputs.enabled == 'true'
        env:
          FROZEN_ALLOCATION_HARNESS_WORKTREE: ${{ runner.temp }}/frozen-allocation-harness
        run: |
          git worktree add --detach "$FROZEN_ALLOCATION_HARNESS_WORKTREE" "$FROZEN_ALLOCATION_HARNESS_SHA"
          cd "$FROZEN_ALLOCATION_HARNESS_WORKTREE"
          CARGO_TARGET_DIR="$FROZEN_ALLOCATION_HARNESS_TARGET_DIR" \
            cargo test --locked -p calc-flow --bench allocation_regression --all-features
      - name: Reclaim Rust test build disk before allocation comparison
        if: >-
          steps.frozen_allocation_harness.outputs.enabled == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.sha == env.FROZEN_ALLOCATION_HARNESS_SHA
        run: cargo clean
      - name: Compare candidate allocations
        if: >-
          steps.frozen_allocation_harness.outputs.enabled == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.sha == env.FROZEN_ALLOCATION_HARNESS_SHA
        timeout-minutes: 120
        env:
          FROZEN_ALLOCATION_BASELINE_REPORT: ${{ runner.temp }}/frozen-allocation-harness/target/allocation-regression/baseline-2ac7e97.json
          FROZEN_ALLOCATION_CANDIDATE_REPORT: ${{ runner.temp }}/frozen-allocation-candidate/target/allocation-regression/candidate.json
          FROZEN_ALLOCATION_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          FROZEN_ALLOCATION_CANDIDATE_WORKTREE: ${{ runner.temp }}/frozen-allocation-candidate
          FROZEN_ALLOCATION_HARNESS_WORKTREE: ${{ runner.temp }}/frozen-allocation-harness
        run: |
          git worktree add --detach "$FROZEN_ALLOCATION_CANDIDATE_WORKTREE" "$FROZEN_ALLOCATION_CANDIDATE_SHA"
          cd "$FROZEN_ALLOCATION_HARNESS_WORKTREE"
          CARGO_TARGET_DIR="$FROZEN_ALLOCATION_HARNESS_TARGET_DIR" CARGO_BUILD_JOBS=1 \
            cargo bench --locked -p calc-flow --bench allocation_regression -- \
            --warmup-dispatches 1000 \
            --measured-dispatches 10000 \
            --repetitions 10 \
            --cases all-existing-data \
            --role baseline \
            --output "$FROZEN_ALLOCATION_BASELINE_REPORT"
          cd "$FROZEN_ALLOCATION_CANDIDATE_WORKTREE"
          CARGO_TARGET_DIR="$FROZEN_ALLOCATION_CANDIDATE_TARGET_DIR" CARGO_BUILD_JOBS=1 \
            cargo bench --locked -p calc-flow --bench allocation_regression -- \
            --warmup-dispatches 1000 \
            --measured-dispatches 10000 \
            --repetitions 10 \
            --cases all-existing-data \
            --role candidate \
            --output "$FROZEN_ALLOCATION_CANDIDATE_REPORT"
          CARGO_TARGET_DIR="$FROZEN_ALLOCATION_CANDIDATE_TARGET_DIR" CARGO_BUILD_JOBS=1 \
            cargo bench --locked -p calc-flow --bench allocation_regression -- \
            --compare "$FROZEN_ALLOCATION_BASELINE_REPORT" "$FROZEN_ALLOCATION_CANDIDATE_REPORT"
      - name: Remove frozen allocation worktrees
        if: always() && steps.frozen_allocation_harness.outputs.enabled == 'true'
        env:
          FROZEN_ALLOCATION_CANDIDATE_WORKTREE: ${{ runner.temp }}/frozen-allocation-candidate
          FROZEN_ALLOCATION_HARNESS_WORKTREE: ${{ runner.temp }}/frozen-allocation-harness
        run: |
          if [ -e "$FROZEN_ALLOCATION_CANDIDATE_WORKTREE/.git" ]; then
            git worktree remove --force "$FROZEN_ALLOCATION_CANDIDATE_WORKTREE"
          fi
          if [ -e "$FROZEN_ALLOCATION_HARNESS_WORKTREE/.git" ]; then
            git worktree remove --force "$FROZEN_ALLOCATION_HARNESS_WORKTREE"
          fi
          git worktree prune
      - name: Install Rust coverage tool
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Reclaim Rust build disk before coverage
        run: |
          cargo clean
          cargo clean --target-dir "$FROZEN_ALLOCATION_HARNESS_TARGET_DIR"
          cargo clean --target-dir "$FROZEN_ALLOCATION_CANDIDATE_TARGET_DIR"
      - name: Enforce combined Rust and connector line coverage
        run: python3.13 scripts/run_rust_coverage.py
      - name: Upload Rust coverage report
        if: ${{ always() && hashFiles('rust-lcov.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: rust-lcov.info
          if-no-files-found: error
          retention-days: 14
      - name: Report Rust coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: rust
          file: rust-lcov.info
          parallel: true
      - name: Reclaim coverage build disk before docs
        run: cargo llvm-cov clean --workspace
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
  rust-supply-chain:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install locked audit tools
        uses: taiki-e/install-action@537c30d2b45cc3aa3fb35e2bbcfb61ef93fd6f02 # v2.62.52
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Check RustSec advisories
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0176
          --ignore RUSTSEC-2026-0177
          --ignore RUSTSEC-2026-0235
      - name: Check licenses, sources, advisories, and duplicate policy
        run: cargo deny --locked check
  coveralls-finish:
    name: Coveralls finish
    needs:
      - lint-and-test
      - studio-backend
      - rust-core
    runs-on: ubuntu-latest
    steps:
      - name: Close the parallel Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
