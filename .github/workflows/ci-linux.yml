name: Linux CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Build + isolated wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: 86781a39f51fcbd49e3c4d50f96e3a84ddce350b
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: |
          python -m unittest \
            scripts.test_build_python_release \
            scripts.test_cargo_features \
            scripts.test_check_spec_references \
            scripts.test_classify_ci_changes \
            scripts.test_codex_agents \
            scripts.test_coveralls_download \
            scripts.test_generate_rolling_kernel_manifest \
            scripts.test_inspect_wheel \
            scripts.test_native_release_identity \
            scripts.test_prune_actions_caches \
            scripts.test_python_compatibility \
            scripts.test_repair_rust_toolchain \
            scripts.test_release_collectors \
            scripts.test_release_config \
            scripts.test_release_workflow \
            scripts.test_resolve_coverage_baseline \
            scripts.test_run_examples \
            scripts.test_run_rust_coverage \
            scripts.test_run_rust_tests \
            scripts.test_rust_toolchain_diagnostics \
            scripts.test_toolkit \
            scripts.test_verify_complexity_gates \
            scripts.test_inspect_v3_wheel \
            scripts.test_verify_python_release \
            scripts.test_verify_security_gates
          uv build --sdist
          uv build --wheel --config-setting 'build-args=--features pyo3/abi3-py313'
          python scripts/inspect_wheel.py core-wheel dist/calc_flow_python-*.whl
          python scripts/inspect_wheel.py sdist dist/calc_flow_python-*.tar.gz
      - name: Install and execute the wheel in isolation
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel}"
          uv venv /tmp/calc-flow-wheel
          uv pip install --python /tmp/calc-flow-wheel/bin/python "${wheel}"
          /tmp/calc-flow-wheel/bin/python scripts/smoke_wheel.py
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
