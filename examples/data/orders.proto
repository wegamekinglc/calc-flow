syntax = "proto3";

package calcflow.examples;

// One order line shared by the Kafka connector examples; mirrors
// examples/data/orders.jsonl. Regenerate orders.pb with:
//   protoc --descriptor_set_out=examples/data/orders.pb \
//     --proto_path=examples/data orders.proto
message Order {
  int64 id = 1;
  int64 quantity = 2;
  double price = 3;
}
