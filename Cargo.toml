[workspace]
members = ["crates/calc-flow", "crates/calc-flow-python"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/wegamekinglc/calc-flow"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
command-group = "5.0.1"
criterion = { version = "0.8.0", features = ["async_tokio"] }
datafusion = { version = "=54.0.0", default-features = false, features = ["datetime_expressions", "regex_expressions", "sql", "unicode_expressions"] }
futures = "0.3.31"
fs2 = "0.4.3"
hex = "0.4.3"
parking_lot = "0.12.5"
proptest = "1.7.0"
regex = "1.12.2"
schemars = { version = "1.0.4", features = ["chrono04"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.52.0", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.17"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
