[package]
name = "calc-flow-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Rust-native Calc Flow engine"
publish = false

[lib]
name = "calc_flow_python"
crate-type = ["cdylib"]

[features]
default = ["connector-file"]
legacy-python = ["pyo3/abi3-py39"]
connector-file = ["dep:calc-flow-connectors", "calc-flow-connectors/file"]
connector-kafka = ["dep:calc-flow-connectors", "calc-flow-connectors/kafka", "dep:rdkafka"]
connector-postgresql = ["dep:calc-flow-connectors", "calc-flow-connectors/postgresql"]
connector-mysql = ["dep:calc-flow-connectors", "calc-flow-connectors/mysql"]
connector-clickhouse = ["dep:calc-flow-connectors", "calc-flow-connectors/clickhouse"]
connector-http = ["dep:calc-flow-connectors", "calc-flow-connectors/http"]
connector-websocket = ["dep:calc-flow-connectors", "calc-flow-connectors/websocket"]

[dependencies]
async-trait.workspace = true
calc-flow = { path = "../calc-flow", version = "=2026.9.24" }
calc-flow-connectors = { path = "../calc-flow-connectors", version = "=2026.9.24", default-features = false, optional = true }
chrono.workspace = true
datafusion.workspace = true
ndarray = "0.17.2"
num-complex = "0.4.6"
numpy = "0.28.0"
parking_lot.workspace = true
pyo3 = "0.28.3"
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }
pyo3-arrow = { version = "0.17.0", default-features = false }
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "libz-static", "tokio"], optional = true }
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
pyo3-build-config = "0.28.3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
