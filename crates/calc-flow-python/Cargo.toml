[package]
name = "calc-flow-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Rust-native Calc Flow engine"
publish = false

[lib]
name = "calc_flow_python"
crate-type = ["cdylib"]

[features]
default = ["connector-file"]
connector-file = ["dep:calc-flow-connectors", "calc-flow-connectors/file"]
connector-kafka = ["dep:calc-flow-connectors", "calc-flow-connectors/kafka"]
connector-postgresql = ["dep:calc-flow-connectors", "calc-flow-connectors/postgresql"]
connector-clickhouse = ["dep:calc-flow-connectors", "calc-flow-connectors/clickhouse"]
connector-http = ["dep:calc-flow-connectors", "calc-flow-connectors/http"]
connector-websocket = ["dep:calc-flow-connectors", "calc-flow-connectors/websocket"]

[dependencies]
async-trait.workspace = true
calc-flow = { path = "../calc-flow", version = "=3.0.0" }
calc-flow-connectors = { path = "../calc-flow-connectors", version = "=3.0.0", default-features = false, optional = true }
chrono.workspace = true
datafusion.workspace = true
ndarray = "0.17.2"
num-complex = "0.4.6"
numpy = "0.28.0"
parking_lot.workspace = true
pyo3 = { version = "0.28.3", features = ["abi3-py313"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }
pyo3-arrow = "0.17.0"
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
