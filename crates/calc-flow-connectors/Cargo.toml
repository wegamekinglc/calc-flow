[package]
name = "calc-flow-connectors"
description = "Connector implementations for the Calc-Flow continuous runtime"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["file"]
mysql = ["dep:mysql_async", "dep:chrono", "dep:hex", "dep:sha2", "dep:rustls", "arrow/ipc"]
file = ["dep:parquet"]
kafka = [
    "dep:hex",
    "dep:prost",
    "dep:prost-reflect",
    "dep:prost-types",
    "dep:rdkafka",
    "dep:serde",
    "dep:sha2",
]
clickhouse = ["dep:hex", "dep:reqwest", "dep:serde", "dep:sha2"]
http = [
    "dep:reqwest",
    "dep:tracing",
]
websocket = [
    "dep:futures-util",
    "dep:rustls",
    "dep:tokio-tungstenite",
    "dep:tracing",
]
postgresql = [
    "dep:chrono",
    "dep:hex",
    "dep:postgres-types",
    "dep:pgwire-replication",
    "dep:rustls",
    "dep:rust_decimal",
    "dep:sha2",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
    "dep:uuid",
]

[dependencies]
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"], optional = true }
calc-flow = { path = "../calc-flow", version = "=2026.9.24" }
arrow = { version = "=58.3.0", default-features = false }
arrow-csv = "=58.3.0"
arrow-json = "=58.3.0"
async-trait.workspace = true
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
bytes = "1.12.1"
# Selects the pure-Rust backend for parquet's gzip codec; the direct
# flate2 dependency keeps feature unification on rust_backend.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# "flate2-rust_backened" is parquet's own (misspelled) feature name;
# selecting it keeps parquet's gzip codec on the pure-Rust backend.
chrono = { workspace = true, optional = true }
postgres-types = { version = "=0.2.14", optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "stream",
], optional = true }
serde = { workspace = true, optional = true }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
], optional = true }
tokio-postgres = { version = "=0.7.18", features = [
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-uuid-1",
], optional = true }
parquet = { version = "=58.3.0", default-features = false, features = [
    "arrow",
    "flate2-rust_backened",
    "snap",
], optional = true }
rdkafka = { version = "=0.39.0", default-features = false, features = [
    "cmake-build",
    "libz-static",
    "tokio",
], optional = true }
pgwire-replication = { version = "=0.4.0", default-features = false, features = [
    "scram",
    "tls-rustls",
], optional = true }
prost = { version = "=0.14.4", optional = true }
prost-reflect = { version = "=0.16.5", default-features = false, optional = true }
prost-types = { version = "=0.14.4", optional = true }
rustls = { version = "=0.23.45", default-features = false, features = [
    "ring",
    "std",
], optional = true }
rust_decimal = { version = "=1.42.1", default-features = false, features = [
    "db-tokio-postgres",
    "std",
], optional = true }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = [
    "ring",
    "webpki-roots",
], optional = true }
serde_json.workspace = true
tokio.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
allocation-counter = "=0.8.1"
clap = { version = "=4.6.1", default-features = false, features = ["std", "help", "usage", "error-context"] }
datafusion.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[example]]
name = "late_output_recovery"
required-features = ["file"]

[[example]]
name = "kafka_protobuf_source"
required-features = ["kafka"]

[[example]]
name = "kafka_custom_decoder"
required-features = ["kafka"]

[package.metadata.release]
# Packaging and publication follow the M7-04 release decision.
release = false
