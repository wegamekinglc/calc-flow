[project]
name = "calc-flow-python"
version = "2026.9.24"
description = "Python expression API for batch and streaming calculations on a Rust runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.12.0,<3",
    "pyarrow>=21.0.0,<22; python_version < '3.10'",
    "pyarrow>=24.0.0,<25; python_version >= '3.10'",
    "typing-extensions>=4.12",
]

[project.urls]
Repository = "https://github.com/wegamekinglc/calc-flow"

[project.optional-dependencies]
numpy = ["numpy>=2.0.0"]
jax = ["jax>=0.4.30,<0.4.31; python_version < '3.10'", "jax>=0.4; python_version >= '3.10'"]
array = ["jax>=0.4.30,<0.4.31; python_version < '3.10'", "jax>=0.4; python_version >= '3.10'", "numpy>=2.0.0"]
benchmark = [
    "TA-Lib==0.7.1",
    "datafusion==54.0.0",
    "jax>=0.4",
    "numpy>=2.0.0",
    "polars>=1.32,<2",
    "psutil>=6.1",
    "py-cpuinfo>=9",
    "pytest>=8",
    "pytest-benchmark>=5.2",
]
dev = [
    "hypothesis>=6.100",
    "jax>=0.4",
    "maturin>=1.14.1,<2.0",
    "numpy>=2.0.0",
    "psutil>=6.1",
    "py-cpuinfo>=9",
    "pytest>=8",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.6",
    "ruff==0.16.0",
]

[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/calc-flow-python/Cargo.toml"
python-source = "python"
module-name = "calc_flow._native"
strip = true

[tool.uv.workspace]
members = ["web-ui/backend"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = [
    "stream_lifecycle: isolated stateful stream lifecycle performance evidence",
]

[tool.coverage.run]
source = ["calc_flow"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
extend-exclude = [
    ".claude/api-notes/**/*.md",
    ".claude/specs/**/*.md",
    ".claude/critiques/**/*.md",
    ".codex/artifacts/**/*.md",
    "design/**/*.md",
]
target-version = "py39"

[tool.ruff.per-file-target-version]
"scripts/*.py" = "py313"
"python/tests/a6_cross_surface_worker.py" = "py312"
"python/tests/test_asof_stream_results.py" = "py310"
"python/tests/test_stream_results.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "calc_flow", "calc_flow_studio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
