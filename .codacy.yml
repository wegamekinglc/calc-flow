---
# Codacy configuration: https://docs.codacy.com/repositories-configure/codacy-configuration-file/
# Tools are enabled/disabled on the Codacy "Code patterns" page; this file
# only keeps generated, vendored, and non-source content out of the analysis.
# When this file exists, the "Ignored files" settings on the Codacy UI do not
# apply and every exclusion must live here.
engines:
  bandit:
    # Pytest assertions are test oracles, not production authorization checks.
    exclude_paths:
      - "python/tests/**"
      - "web-ui/backend/tests/**"
      # Benchmark scenario files carry the same test-oracle asserts and
      # constant-only SQL templates with no untrusted input.
      - "benchmarks/test_*.py"
  biome:
    # The frontend is React and is already governed by the repository ESLint
    # configuration. Biome's default Qwik and no-React patterns misclassify
    # valid React closures and className attributes.
    exclude_paths:
      - "web-ui/**"
  eslint:
    # The repository lints the frontend through `npm run lint` in CI using its
    # own ESLint 10 flat config (typescript-eslint, react-hooks). That config
    # resolves plugin devDependencies from web-ui/node_modules, which the
    # Codacy sandbox does not install, so the sandboxed engine can only fail
    # to load the config for every file. Keep the Codacy engine away from the
    # frontend and rely on the repository gate.
    exclude_paths:
      - "web-ui/**"
exclude_paths:
  # Build artifacts and local environments
  - ".venv/**"
  - ".worktrees/**"
  - "target/**"
  - "dist/**"
  - "web-ui/node_modules/**"
  - "web-ui/dist/**"
  - "web-ui/test-results/**"
  # Generated lockfile: Rust dependency advisories are governed by the
  # cargo-audit and cargo-deny jobs, which carry the documented RUSTSEC
  # waivers (parquet 58 still pins thrift ^0.17 until the arrow 59 line).
  - "Cargo.lock"
  # Test caches and coverage output
  - ".benchmarks/**"
  - ".hypothesis/**"
  - ".pytest_cache/**"
  - ".ruff_cache/**"
  - "**/__pycache__/**"
  # Local runtime state directories
  - ".calc-flow-checkpoints/**"
  - ".calc-flow-projects/**"
  - ".calc-flow-web/**"
  # Codacy's Rust parser miscounts function length across the
  # clickhouse module's split files; the function is 20 lines in a
  # balanced-brace file.
  - "crates/calc-flow-connectors/src/clickhouse*.rs"
  # Generated JSON Schema contracts
  - "schemas/**"
  - "web-ui/src/api/schema.d.ts"
  # Historical parity evidence, kept verbatim on purpose
  - "tests/fixtures/**"
  # Frozen executable allocation evidence, kept byte-identical to its baseline
  - "crates/calc-flow/benches/allocation_regression.rs"
  # Agent tooling and internal planning notes
  - ".claude/**"
  - ".codex/**"
  - ".superpowers/**"
  - "docs/superpowers/**"
