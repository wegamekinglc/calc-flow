[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0176", reason = "Temporary: DataFusion 55 requires Arrow 59; the pyo3-arrow 0.18 bridge preserves the existing NumPy/PyO3 0.28 binding; Calc Flow never calls BoundListIterator or BoundTupleIterator nth/nth_back. Remove when the NumPy/PyO3 binding moves to a patched release." },
    { id = "RUSTSEC-2026-0177", reason = "Temporary: DataFusion 55 requires Arrow 59; the pyo3-arrow 0.18 bridge preserves the existing NumPy/PyO3 0.28 binding; Calc Flow never constructs PyCFunction closures. Remove when the NumPy/PyO3 binding moves to a patched release." },
]

[licenses]
allow = [
    "Apache-2.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
