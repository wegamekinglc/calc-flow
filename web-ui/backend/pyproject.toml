[project]
name = "calc-flow-studio"
version = "2.0.0"
description = "Local FastAPI backend for Calc Flow Studio"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "calc-flow>=2.0.0,<3",
    "cloudpickle>=3.1",
    "fastapi>=0.116",
    "pyarrow>=24.0.0,<25",
    "uvicorn>=0.35",
]

[project.urls]
Repository = "https://github.com/wegamekinglc/calc-flow"

[project.optional-dependencies]
dev = [
    "httpx2>=2.5",
    "numpy>=2.0.0",
    "pytest>=8",
    "pytest-cov>=7.1",
]

[project.scripts]
calc-flow-web = "calc_flow_studio:serve"

[tool.uv.sources]
calc-flow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calc_flow_studio"]
artifacts = ["src/calc_flow_studio/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["calc_flow_studio"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
